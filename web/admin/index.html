<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicciones · Back-office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Back-office de Predicciones: barra lateral fija + área de trabajo. Se sirve en /admin/ o se aloja aparte
   (por ejemplo en el dominio del back-office del casino) apuntando a la API con ?api=https://… */
:root {
  --bg: #0d0e11; --side: #121318; --card: #17181d; --card-2: #1f2027; --line: #2a2b33; --grid: #24252c;
  --text: #f1f2f4; --muted: #9a9ca8; --faint: #6c6e79;
  --brand: #ffd400; --brand-ink: #111;
  --ok: #2bb560; --ok-txt: #6ee08f; --warn: #f2a93b; --bad: #ef5350; --bad-txt: #ff8a8c; --info: #60a5fa;
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
a { color: var(--info); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.ok { color: var(--ok-txt); } .bad { color: var(--bad-txt); } .warn { color: var(--warn); }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } .side { position: static !important; height: auto !important; } .nav { flex-direction: row !important; overflow-x: auto; } .nav a { white-space: nowrap; } .side .foot { display: none; } }
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 16px 12px; gap: 18px; }
.brand { font-weight: 800; font-size: 18px; padding: 0 8px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; }
.nav a:hover { background: var(--card); color: var(--text); }
.nav a.on { background: var(--card-2); color: var(--text); box-shadow: inset 3px 0 0 var(--brand); }
.nav .count { font-family: var(--mono); font-size: 11px; background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 1px 7px; }
.side .foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }

main { padding: 22px 26px 60px; min-width: 0; }
@media (max-width: 560px) { main { padding: 16px; } }
.head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 24px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: #3a3b45; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.ok { background: color-mix(in srgb, var(--ok) 22%, var(--card)); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); color: var(--ok-txt); }
.btn.bad { background: color-mix(in srgb, var(--bad) 18%, var(--card)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); color: var(--bad-txt); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.input, select.input, textarea.input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.45; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
label.f > span em { font-style: normal; color: var(--faint); font-weight: 500; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.kpi .v { font-family: var(--mono); font-size: 24px; font-weight: 700; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.kpi.attn { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h2 small { color: var(--muted); font-weight: 500; font-size: 12px; }

.cov { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
.cov .bar { position: relative; height: 12px; background: var(--card-2); border-radius: 3px; }
.cov .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ok); }
.cov .bar i.p { background: var(--brand); opacity: .55; }
.cov .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .7; }
.cov .n { text-align: right; font-family: var(--mono); font-size: 12px; }

.chart svg text { fill: var(--faint); font-family: var(--mono); font-size: 10px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); position: sticky; top: 0; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td .t { font-weight: 600; max-width: 460px; min-width: 240px; }
a.btn { text-decoration: none; display: inline-block; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card-2); white-space: nowrap; }
.pill.open { color: var(--ok-txt); } .pill.closed, .pill.resolving, .pill.proposed { color: var(--warn); } .pill.disputed, .pill.void, .pill.error { color: var(--bad-txt); } .pill.resolved, .pill.finalized { color: var(--info); }
.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opt { font-size: 11px; background: var(--card-2); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.opt b { font-family: var(--mono); }

/* Diseñador */
.designer { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .designer { grid-template-columns: minmax(0, 1fr); } }
.form { display: flex; flex-direction: column; gap: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .form .two { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: var(--card-2); border-radius: 8px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--bg); color: var(--text); }
.outrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 34px; gap: 8px; align-items: center; }
.outrow input[type=range] { width: 100%; accent-color: var(--brand); }
.sum { font-size: 12px; font-family: var(--mono); }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checks div::before { margin-right: 6px; }
.checks .y::before { content: "✓"; color: var(--ok-txt); } .checks .n::before { content: "✕"; color: var(--bad-txt); }
.preview { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
.pcard { background: #17171a; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pcard .pic { height: 84px; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #3a3000, #0b0b0c 75%); position: relative; }
.pcard .pic img { width: 100%; height: 100%; object-fit: cover; }
.pcard .badge { position: absolute; left: 8px; bottom: -9px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 999px; color: #111; background: var(--brand); }
.pcard .body { padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.pcard .q { font-weight: 600; font-size: 15px; line-height: 1.3; }
.pcard .big { font-family: var(--mono); font-weight: 700; font-size: 20px; }
.pcard .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: var(--mono); font-size: 12px; }
.pcard .yn span { border-radius: 6px; padding: 6px; text-align: center; }
.pcard .yn .y { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok-txt); }
.pcard .yn .n { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad-txt); }
.pcard .mo { position: relative; display: flex; justify-content: space-between; font-size: 12px; padding: 5px 8px; border-radius: 6px; background: var(--card-2); overflow: hidden; }
.pcard .mo i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--brand) 16%, transparent); }
.pcard .mo span, .pcard .mo b { position: relative; }
.rules { font-size: 12px; color: var(--muted); line-height: 1.5; background: var(--card-2); border-radius: 10px; padding: 10px 12px; }
.rules b { color: var(--text); }

.cards { display: flex; flex-direction: column; gap: 10px; }
.dcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.dcard h3 { margin: 0 0 6px; font-size: 15px; }
.dcard .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.dcard details { font-size: 12px; color: var(--muted); margin-top: 8px; }
.dcard details p { margin: 6px 0; line-height: 1.45; }
.dcard .acts { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 700px) { .dcard { grid-template-columns: 22px minmax(0, 1fr); } .dcard .acts { grid-column: 2; flex-direction: row; flex-wrap: wrap; } }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { margin: 0; font-size: 17px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; z-index: 60; max-width: 420px; font-size: 13px; }
.toast.err { border-color: var(--bad); }
.login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
.login .panel { width: min(400px, 100%); display: flex; flex-direction: column; gap: 12px; }
.creds { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; word-break: break-all; display: flex; flex-direction: column; gap: 6px; }
.bars2 { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px 40px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
.bars2 .bar { position: relative; height: 12px; background: var(--card-2); border-radius: 3px; }
.bars2 .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--brand); opacity: .85; }
.bars2 .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .6; }
.calib text { fill: var(--faint); font-family: var(--mono); font-size: 11px; }
.banner { border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
.banner b { color: var(--text); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
@media (max-width: 1100px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
.help { font-size: 12px; color: var(--faint); line-height: 1.5; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="panel" id="loginForm">
    <div class="brand"><i>P</i><div>Predicciones<small>Back-office</small></div></div>
    <label class="f"><span>Clave de administración (ADMIN_API_KEY)</span><input class="input" id="lkKey" type="password" required autocomplete="current-password"></label>
    <label class="f"><span>Tu nombre <em>(queda registrado en aprobaciones y resoluciones)</em></span><input class="input" id="lkUser" required autocomplete="username"></label>
    <label class="f"><span>URL de la API <em>(vacío = este mismo servidor)</em></span><input class="input" id="lkApi" placeholder="https://api.predicciones.tu-dominio.com"></label>
    <button class="btn primary" type="submit">Entrar</button>
    <div class="bad" id="lkErr" role="alert"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><i>P</i><div>Predicciones<small>Back-office</small></div></div>
    <nav class="nav" id="nav">
      <a href="#resumen" data-v="resumen">Resumen</a>
      <a href="#disenar" data-v="disenar">Diseñar mercado</a>
      <a href="#moderacion" data-v="moderacion">Moderación <span class="count" id="cDrafts" hidden></span></a>
      <a href="#mercados" data-v="mercados">Mercados</a>
      <a href="#resoluciones" data-v="resoluciones">Resoluciones <span class="count" id="cRes" hidden></span></a>
      <a href="#tendencias" data-v="tendencias">Tendencias y señales</a>
      <a href="#fuentes" data-v="fuentes">Fuentes</a>
      <a href="#calibracion" data-v="calibracion">Calibración y sesgo</a>
      <a href="#oraculo" data-v="oraculo">Oráculo</a>
      <a href="#riesgo" data-v="riesgo">Riesgo de la casa</a>
      <a href="#operadores" data-v="operadores">Casinos</a>
    </nav>
    <div class="foot"><span id="whoami"></span><span id="apiInfo"></span><button class="btn sm" id="logout" type="button">Salir</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ---------- Estado y utilidades ----------
const qs = new URLSearchParams(location.search);
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };
// La URL de la API puede venir fijada en el HTML (<meta name="predicciones-api">) cuando el panel se aloja en otro dominio
const DEFAULT_API = document.querySelector('meta[name="predicciones-api"]')?.content ?? "";
const A = { key: store.get("pa_key"), user: store.get("pa_user"), api: qs.get("api") ?? store.get("pa_api") ?? DEFAULT_API };
let CATS = [], OV = null, VIEW = "resumen", DESIGN = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (m) => "$" + (Number(m) / 1e6).toLocaleString("es-EC", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kmoney = (m) => { const u = Number(m) / 1e6; return u >= 1e6 ? "$" + (u / 1e6).toLocaleString("es-EC", { maximumFractionDigits: 2 }) + " M" : u >= 1e4 ? "$" + (u / 1e3).toLocaleString("es-EC", { maximumFractionDigits: 1 }) + " k" : "$" + u.toLocaleString("es-EC", { maximumFractionDigits: 2 }); };
const fdate = (d) => d ? new Date(d).toLocaleString("es-EC", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const fday = (d) => d ? new Date(d).toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" }) : "—";
const catName = (s) => CATS.find((c) => c.slug === s)?.name ?? s;
const ago = (d) => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
const until = (d) => { const m = Math.round((new Date(d) - Date.now()) / 60000); return m <= 0 ? "terminó" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const STATUS = { open: "Abierto", closed: "Cerrado", resolving: "En resolución", resolved: "Resuelto", void: "Anulado", proposed: "Propuesta", disputed: "Disputada", finalized: "Finalizada", rejected: "Rechazada", pending: "Pendiente", approved: "Aprobado" };
const pill = (s) => `<span class="pill ${esc(s)}">${esc(STATUS[s] ?? s)}</span>`;

function toast(msg, err) { const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 4500); }

async function api(path, opts = {}) {
  const r = await fetch(A.api.replace(/\/$/, "") + path, { ...opts, headers: { "content-type": "application/json", "x-admin-key": A.key ?? "", "x-admin-user": A.user ?? "", ...(opts.headers ?? {}) }, body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error("Sesión de administración inválida"); }
  if (!r.ok) throw new Error(body.message ?? `Error ${r.status}`);
  return body;
}
async function run(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); return r; }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

/** Ventana modal con formulario. fields: [{id,label,type,options,value,placeholder}] -> devuelve objeto o null. */
function modal({ title, text = "", fields = [], ok = "Confirmar", danger = false }) {
  return new Promise((resolve) => {
    const root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="modal-bg"><form class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text ? `<div class="muted" style="line-height:1.5">${text}</div>` : ""}
      ${fields.map((f) => `<label class="f"><span>${esc(f.label)}</span>${f.type === "select" ? `<select class="input" id="m_${f.id}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.value ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>` : f.type === "textarea" ? `<textarea class="input" id="m_${f.id}" placeholder="${esc(f.placeholder ?? "")}">${esc(f.value ?? "")}</textarea>` : f.type === "checkbox" ? `<span class="row"><input type="checkbox" id="m_${f.id}" ${f.value ? "checked" : ""}> ${esc(f.hint ?? "")}</span>` : `<input class="input" id="m_${f.id}" type="${f.type ?? "text"}" value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder ?? "")}">`}</label>`).join("")}
      <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-x>Cancelar</button><button class="btn ${danger ? "bad" : "primary"}" type="submit">${esc(ok)}</button></div></form></div>`;
    const form = root.querySelector("form");
    const close = (v) => { root.innerHTML = ""; resolve(v); };
    root.querySelector("[data-x]").onclick = () => close(null);
    root.querySelector(".modal-bg").onclick = (e) => { if (e.target.classList.contains("modal-bg")) close(null); };
    form.onsubmit = (e) => { e.preventDefault(); const out = {}; for (const f of fields) { const el = document.getElementById("m_" + f.id); out[f.id] = f.type === "checkbox" ? el.checked : el.value; } close(out); };
    (form.querySelector("input,select,textarea") ?? form.querySelector("button[type=submit]")).focus();
  });
}

function barChart(data, { h = 140, fmt = (v) => v, label = "" } = {}) {
  const W = 600, pad = { l: 4, r: 4, t: 8, b: 18 }, max = Math.max(1, ...data.map((d) => d.v));
  const bw = (W - pad.l - pad.r) / data.length;
  const bars = data.map((d, i) => { const bh = (d.v / max) * (h - pad.t - pad.b); return `<rect x="${pad.l + i * bw + 1}" y="${h - pad.b - bh}" width="${Math.max(1, bw - 2)}" height="${bh}" rx="2" fill="var(--brand)" opacity="${d.v ? .85 : .2}"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></rect>`; }).join("");
  const ticks = data.map((d, i) => i % 4 === 0 ? `<text x="${pad.l + i * bw + bw / 2}" y="${h - 4}" text-anchor="middle">${esc(d.short)}</text>` : "").join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${bars}${ticks}</svg></div>`;
}

// ---------- Diseñador ----------
const blankDesign = () => ({ title: "", description: "", category: CATS[0]?.slug ?? "politica", kind: "binary", yes: 0.5,
  outcomes: [{ label: "", probability: 0.34 }, { label: "", probability: 0.33 }, { label: "Otro", probability: 0.33 }],
  closeTime: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 16), resolutionCriteria: "", resolutionSource: "", imageUrl: "", tags: "", featured: false, draftId: null });

function designFromPayload(p, draftId = null) {
  const multi = p.kind === "multi";
  return { ...blankDesign(), title: p.title ?? "", description: p.description ?? "", category: p.category, kind: p.kind ?? "binary",
    yes: multi ? 0.5 : p.outcomes?.[0]?.probability ?? 0.5, outcomes: multi ? p.outcomes.map((o) => ({ label: o.label, probability: o.probability })) : blankDesign().outcomes,
    closeTime: p.closeTime ? new Date(new Date(p.closeTime).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : blankDesign().closeTime,
    resolutionCriteria: p.resolutionCriteria ?? "", resolutionSource: p.resolutionSource ?? "", imageUrl: p.imageUrl ?? "", tags: (p.tags ?? []).join(", "), featured: !!p.featured, draftId };
}
function designPayload(d) {
  return { title: d.title.trim(), description: d.description.trim(), category: d.category, kind: d.kind,
    outcomes: d.kind === "binary" ? [{ label: "Sí", probability: Number(d.yes) }] : d.outcomes.filter((o) => o.label.trim()).map((o) => ({ label: o.label.trim(), probability: Number(o.probability) })),
    closeTime: new Date(d.closeTime).toISOString(), resolutionCriteria: d.resolutionCriteria.trim(), resolutionSource: d.resolutionSource.trim(),
    ...(d.imageUrl.trim() ? { imageUrl: d.imageUrl.trim() } : {}), tags: d.tags.split(",").map((t) => t.trim()).filter(Boolean), featured: d.featured };
}
function designChecks(d) {
  const p = designPayload(d), close = new Date(d.closeTime);
  const sum = p.outcomes.reduce((a, o) => a + o.probability, 0);
  return [
    [/^¿.{6,}\?$/.test(p.title), "La pregunta empieza con ¿ y termina con ?"],
    [p.title.length <= 200, "Máximo 200 caracteres"],
    [close > new Date(Date.now() + 3600e3), "Cierra al menos 1 hora en el futuro"],
    [p.kind === "binary" || (p.outcomes.length >= 2 && p.outcomes.length <= 20), "Opción múltiple: entre 2 y 20 opciones con nombre"],
    [p.kind === "binary" || Math.abs(sum - 1) <= 0.02, `Las probabilidades suman 100% (ahora ${Math.round(sum * 100)}%)`],
    [p.outcomes.every((o) => o.probability >= 0.01 && o.probability <= 0.99), "Cada probabilidad entre 1% y 99%"],
    [p.resolutionCriteria.length >= 10, "Criterio de resolución claro (mín. 10 caracteres)"],
    [p.resolutionSource.length >= 3, "Fuente oficial que decide"],
  ];
}

    const r = await modal({ title: "Cerrar mercado", text: `Se detienen las apuestas de <b>${esc(ev(b.dataset.close).title)}</b> y se devuelven las órdenes pendientes. Después hay que resolverlo.`, ok: "Cerrar ahora", danger: true });

}
async function resolveDialog(e, btn) {
  const options = e.kind === "multi" ? [...e.markets.map((m) => [String(m.id), `Gana: ${m.label}`]), ["VOID", "Anular (paga $0,50 por acción)"]] : [["YES", "Sí"], ["NO", "No"], ["VOID", "Anular (paga $0,50 por acción)"]];
  const fields = [{ id: "result", label: "Resultado", type: "select", options }, { id: "explanation", label: "Explicación (la verán los jugadores)", type: "textarea" }, { id: "url", label: "Evidencia (URL de la fuente oficial)", type: "url", placeholder: "https://" }];
  const r = await modal({ title: "Proponer resolución", text: `<b>${esc(e.title)}</b><br>Fuente: ${esc(e.resolutionSource)}<br>Se detiene el trading y corre la ventana de disputa antes de pagar.${OV?.aiEnabled ? "" : ""}`, fields, ok: "Proponer" });
  if (!r) return;
  const body = { explanation: r.explanation, evidence: r.url ? [{ url: r.url }] : [] };
  if (r.result === "VOID" || r.result === "YES" || r.result === "NO") body.outcome = r.result; else body.winningMarketId = Number(r.result);
  run(btn, () => api(`/admin/events/${e.id}/resolve`, { method: "POST", body }), "Propuesta creada. Corre la ventana de disputa.").then(async (x) => { if (x) { await refreshCounts(); route(); } });
}

  el.innerHTML = `<div class="head"><div><h1>Resoluciones</h1><p>Como el oráculo optimista de Polymarket: alguien propone el resultado con una fianza, corre la ventana de disputa y, si nadie disputa, se paga $1 por acción ganadora. Si hay disputa, decides tú: quien tenía razón recupera su fianza y se lleva la mitad de la del otro.</p></div>
    <span class="seg" id="rStatus">${[["proposed,disputed", "Abiertas"], ["finalized", "Finalizadas"], ["rejected", "Rechazadas"]].map(([k, l]) => `<button type="button" data-s="${k}" class="${k === status ? "on" : ""}">${l}</button>`).join("")}</span></div>
    <div class="cards">${list.length ? list.map((r) => `<div class="dcard"><span></span><div><h3>${esc(r.title)}</h3>
      <div class="meta">${pill(r.status)}<span>Resultado: <b>${r.outcome === "VOID" ? "Anulado" : r.winning_market_id ? `mercado #${r.winning_market_id}` : r.outcome === "YES" ? "Sí" : "No"}</b></span><span>Propuso: ${esc(r.proposer)}</span><span>${ago(r.created_at)}</span>${r.status === "proposed" ? `<span>Ventana: ${until(r.challenge_ends_at)}</span>` : ""}</div>
      ${r.explanation ? `<div class="muted" style="font-size:13px">${esc(r.explanation)}</div>` : ""}
      ${(r.evidence ?? []).length ? `<details><summary>Evidencia</summary><p>${r.evidence.map((x) => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || x.url)}</a>${x.quote ? ` — “${esc(x.quote)}”` : ""}`).join("<br>")}</p></details>` : ""}
      ${r.dispute_reason ? `<div class="bad" style="font-size:13px;margin-top:6px">Disputa (${esc(r.disputed_by)}): ${esc(r.dispute_reason)}${(r.dispute_evidence ?? []).map((x) => ` · <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title || "evidencia")}</a>`).join("")}</div>` : ""}
      ${r.dispute_result ? `<div class="muted" style="font-size:12px;margin-top:4px">${r.dispute_result === "dispute_upheld" ? "Tenía razón quien disputó" : "Tenía razón quien propuso"}${r.decided_by ? ` · decidió ${esc(r.decided_by)}` : ""}</div>` : ""}
      ${(r.bonds ?? []).length ? `<div class="faint" style="font-size:12px;margin-top:4px">Fianzas: ${r.bonds.map((b) => `${b.role === "proposer" ? "propuso" : "disputó"} ${b.playerId ? "jugador" : "la casa"} $${(b.amount / 1e6).toFixed(0)} · ${{ held: "retenida", returned: "devuelta", rewarded: `devuelta con premio ($${(b.payout / 1e6).toFixed(0)})`, forfeited: "perdida" }[b.status]}`).join(" · ")}</div>` : ""}</div>
      <div class="acts">${r.status === "proposed" ? `<button class="btn sm" data-dis="${r.id}">Disputar</button><button class="btn ok sm" data-fin="${r.id}" data-force="${new Date(r.challenge_ends_at) > new Date() ? 1 : 0}">Finalizar${new Date(r.challenge_ends_at) > new Date() ? " ya" : ""}</button>` : ""}
        ${r.status === "proposed" ? `<button class="btn bad sm" data-rej="${r.id}">Rechazar</button>` : ""}
        ${r.status === "disputed" ? `<button class="btn ok sm" data-keep="${r.id}">Tenía razón quien propuso</button><button class="btn bad sm" data-upheld="${r.id}" data-ev="${r.event_id}">Tenía razón quien disputó</button>` : ""}</div></div>`).join("") : `<div class="empty">No hay resoluciones en este estado.</div>`}</div>
    ${closed.length && status !== "finalized" ? `<h2 style="font-size:16px;margin:24px 0 10px">Cerrados sin propuesta <span class="faint" style="font-size:12px;font-weight:500">la IA puede investigar el resultado</span></h2>
      <div class="tablewrap"><table><tbody>${closed.filter((e) => !e.resolution).map((e) => `<tr><td><div class="t">${esc(e.title)}</div><span class="faint" style="font-size:11px">Cerró ${fday(e.closeTime)} · ${esc(e.resolutionSource)}</span></td><td style="width:1%"><button class="btn sm" data-ai="${e.id}">Resolver con IA</button></td></tr>`).join("")}</tbody></table></div>` : ""}`;
  el.querySelectorAll("#rStatus button").forEach((b) => (b.onclick = () => { viewResoluciones.status = b.dataset.s; route(); }));
  el.querySelectorAll("[data-dis]").forEach((b) => (b.onclick = async () => { const r = await modal({ title: "Disputar propuesta", fields: [{ id: "reason", label: "Motivo", type: "textarea" }], ok: "Disputar", danger: true }); if (r) run(b, () => api(`/admin/resolutions/${b.dataset.dis}/dispute`, { method: "POST", body: { reason: r.reason } }), "Propuesta disputada").then(() => route()); }));
  el.querySelectorAll("[data-keep]").forEach((b) => (b.onclick = async () => {
    const r = list.find((x) => String(x.id) === b.dataset.keep);
    if (!(await modal({ title: "Mantener la propuesta", text: "Se paga el resultado propuesto. Quien propuso recupera su fianza y se lleva la mitad de la de quien disputó.", ok: "Confirmar y pagar" }))) return;
    run(b, () => api(`/admin/resolutions/${r.id}/decide`, { method: "POST", body: r.outcome === "VOID" || !r.winning_market_id ? { outcome: r.outcome } : { winningMarketId: r.winning_market_id } }), (x) => `Finalizada. ${x.payouts ?? 0} pagos enviados.`).then(async () => { await refreshCounts(); route(); });
  }));

  }));
  el.querySelectorAll("[data-rej]").forEach((b) => (b.onclick = async () => {

    run(b, () => api(`/admin/resolutions/${b.dataset.rej}/reject`, { method: "POST", body: {} }), "Propuesta rechazada").then(() => route());
  }));
  el.querySelectorAll("[data-fin]").forEach((b) => (b.onclick = async () => {
    if (b.dataset.force === "1") { const r = await modal({ title: "Finalizar y pagar", text: "Se pagará a los ganadores en sus casinos. Esta acción no se puede deshacer.", ok: "Finalizar" }); if (!r) return; }
    run(b, () => api(`/admin/resolutions/${b.dataset.fin}/finalize`, { method: "POST", body: { force: b.dataset.force === "1" } }), (x) => `Finalizada. ${x.payouts ?? 0} pagos enviados.`).then(async () => { await refreshCounts(); route(); });
  }));
  el.querySelectorAll("[data-ai]").forEach((b) => (b.onclick = () => run(b, () => api(`/admin/events/${b.dataset.ai}/ai-resolve`, { method: "POST", body: {} }), (x) => x.proposed ? `La IA propuso: ${x.decision} (${Math.round(x.confidence * 100)}%)` : `Sin propuesta: ${x.explanation ?? x.decision}`).then(() => route())));
}

    <div class="panel" style="margin-top:14px"><h2>Lo que se publica ahora <small>los 12 mercados con más volumen</small></h2>
      <div class="tablewrap"><table><thead><tr><th>Mercado</th><th class="num">Probabilidad</th><th class="num">Compra / venta</th><th class="num">Volumen</th><th>Confianza</th><th class="num">Externa</th></tr></thead><tbody>
      ${mk.data.markets.map((m) => `<tr><td><div class="t">${esc(m.event)}</div>${m.kind === "multi" ? `<span class="faint" style="font-size:11px">${esc(m.outcome)}</span>` : ""}</td><td class="num"><b>${pct(m.probability)}</b></td><td class="num">${m.bid != null ? Math.round(m.bid * 100) : "—"}¢ / ${m.ask != null ? Math.round(m.ask * 100) : "—"}¢</td><td class="num">$${m.volumeUsd.toLocaleString("es-EC")}</td><td><span class="pill ${m.confidence === "alta" ? "open" : m.confidence === "media" ? "proposed" : "void"}">${m.confidence}</span></td><td class="num">${m.external ? pct(m.external.probability) : "—"}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="faint" style="font-size:12px;margin:10px 0 0">Probabilidad: precio justo del market maker (aprende del dinero de los jugadores y de referencias externas). Confianza: alta con más de $1.000 apostados y spread de 6¢ o menos; media con más de $100 y spread de 10¢ o menos.</p></div>`;
}

function calibrationChart(bins) {
  const W = 360, H = 300, pad = { l: 40, r: 12, t: 12, b: 34 };
  const x = (v) => pad.l + v * (W - pad.l - pad.r), y = (v) => H - pad.b - v * (H - pad.t - pad.b);
  const maxN = Math.max(1, ...bins.map((b) => b.n));
  let g = "";
  for (let t = 0; t <= 1.0001; t += 0.25) g += `<line x1="${x(0)}" x2="${x(1)}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${pad.l - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text><text x="${x(t)}" y="${H - pad.b + 16}" text-anchor="middle">${Math.round(t * 100)}%</text>`;
  const pts = bins.filter((b) => b.n);
  const path = pts.map((b, i) => `${i ? "L" : "M"}${x(b.predicted)} ${y(b.actual)}`).join("");
  const dots = pts.map((b) => `<circle cx="${x(b.predicted)}" cy="${y(b.actual)}" r="${5 + 9 * Math.sqrt(b.n / maxN)}" fill="var(--brand)" fill-opacity=".85" stroke="var(--card)" stroke-width="2"><title>Precio ${Math.round(b.from * 100)}–${Math.round(b.to * 100)}%: ${b.n} mercados · precio medio ${Math.round(b.predicted * 100)}% · se cumplieron ${Math.round(b.actual * 100)}%</title></circle>`).join("");
  return `<svg class="calib" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 1.4}px" role="img" aria-label="Gráfico de calibración: precio frente a porcentaje cumplido">
    ${g}<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>
    ${pts.length > 1 ? `<path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2" opacity=".6"/>` : ""}${dots}
    <text x="${x(0.5)}" y="${H - 4}" text-anchor="middle">Precio del Sí antes del cierre</text>
    <text transform="translate(11 ${y(0.5)}) rotate(-90)" text-anchor="middle">Se cumplió</text></svg>`;
}
const bscore = (v) => (v == null ? "—" : v.toFixed(3));
function brierBars(rows, labelKey) {
  const max = 0.35;
  return rows.filter((r) => r.n).map((r) => `<div class="bars2" title="${esc(r[labelKey])}: Brier ${bscore(r.brierRef)} con ${r.n} mercados (apertura ${bscore(r.brierInitial)})"><span>${esc(r[labelKey])}</span>
    <span class="bar"><i style="width:${Math.min(100, ((r.brierRef ?? 0) / max) * 100)}%"></i><b style="left:${(0.25 / max) * 100}%"></b></span><span class="num" style="text-align:right">${bscore(r.brierRef)}</span><span class="faint num" style="text-align:right">${r.n}</span></div>`).join("") || `<p class="muted">Sin mercados resueltos todavía.</p>`;
}
const pctS = (v) => (v == null ? "—" : `${v > 0 ? "+" : ""}${Math.round(v * 100)} pts`);

async function viewCalibracion(el) {
  const h = viewCalibracion.h ?? 168;
  const r = await api(`/admin/integrity?horizon=${h}`);
  const o = r.overall, I = r.integrity;
  const improve = o.brierInitial != null && o.brierRef != null ? o.brierInitial - o.brierRef : null;
  el.innerHTML = `<div class="head"><div><h1>Calibración y sesgo</h1><p>¿Los precios predicen bien? Se mide con los mercados ya resueltos: si los que estaban a 70% se cumplieron cerca del 70% de las veces, el mercado está bien calibrado.</p></div>
    <span class="seg" id="cH">${[[24, "1 día antes"], [168, "7 días antes"], [720, "30 días antes"]].map(([v, l]) => `<button type="button" data-h="${v}" class="${v === h ? "on" : ""}">${l}</button>`).join("")}</span></div>
    ${!r.reliable ? `<div class="banner"><b>Todavía hay pocos datos:</b> ${o.n} mercados resueltos. Con menos de ${r.minReliable}, estos números son orientativos; con varias decenas por categoría empiezan a ser confiables.</div>` : ""}
    <div class="kpis">
      <div class="kpi"><span class="k">Mercados resueltos</span><span class="v">${o.n}</span><span class="d">Tasa de Sí: ${o.baseRate == null ? "—" : Math.round(o.baseRate * 100) + "%"}</span></div>
      <div class="kpi"><span class="k">Puntaje de Brier</span><span class="v ${o.brierRef != null && o.brierRef < 0.2 ? "ok" : ""}">${bscore(o.brierRef)}</span><span class="d">0 = perfecto · 0,25 = decir 50% a todo</span></div>
      <div class="kpi"><span class="k">Brier al cierre</span><span class="v">${bscore(o.brierClose)}</span><span class="d">Sin información: ${bscore(o.brierBaseRate)}</span></div>
      <div class="kpi"><span class="k">Aporte de los jugadores</span><span class="v ${improve > 0 ? "ok" : improve < 0 ? "bad" : ""}">${improve == null ? "—" : (improve >= 0 ? "+" : "") + improve.toFixed(3)}</span><span class="d">Brier de apertura ${bscore(o.brierInitial)} → ${bscore(o.brierRef)}</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Gráfico de calibración <small>${h === 24 ? "1 día" : h === 168 ? "7 días" : "30 días"} antes del cierre</small></h2>${calibrationChart(r.calibration)}
        <p class="help">Cada punto agrupa mercados por precio; su tamaño indica cuántos. Sobre la diagonal, el precio acierta. Por debajo, se cumplen menos de lo que decía el precio (sobrevalorados); por encima, más (infravalorados).</p>
        <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Tramo de precio</th><th class="num">Mercados</th><th class="num">Precio medio</th><th class="num">Se cumplió</th><th class="num">Desvío</th></tr></thead><tbody>
        ${r.calibration.map((b) => `<tr><td>${Math.round(b.from * 100)}–${Math.round(b.to * 100)}%</td><td class="num">${b.n}</td><td class="num">${b.predicted == null ? "—" : Math.round(b.predicted * 100) + "%"}</td><td class="num">${b.actual == null ? "—" : Math.round(b.actual * 100) + "%"}</td><td class="num ${b.n && Math.abs(b.actual - b.predicted) > 0.1 ? "warn" : ""}">${b.n ? pctS(b.actual - b.predicted) : "—"}</td></tr>`).join("")}</tbody></table></div></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="panel"><h2>Brier por categoría <small>línea = 0,25 · menor es mejor</small></h2>${brierBars(r.byCategory, "name")}</div>
        <div class="panel"><h2>Brier por volumen del mercado</h2>${brierBars(r.byVolume, "tier")}<p class="help">Con más dinero en juego, los precios suelen predecir mejor. Si los mercados chicos tienen Brier alto, conviene no presentarlos como predicción confiable.</p></div>
      </div>
    </div>
    <h2 style="font-size:18px;margin:26px 0 10px">Sesgos</h2>
    <div class="grid3">
      <div class="panel"><h2>Favorito y batacazo</h2>
        <div class="bars2" style="grid-template-columns:1fr auto auto"><span>Batacazos (precio &lt; 20%)</span><b class="num ${(r.bias.longshot.longshots.gap ?? 0) < -0.05 ? "warn" : ""}">${pctS(r.bias.longshot.longshots.gap)}</b><span class="faint num">${r.bias.longshot.longshots.n}</span></div>
        <div class="bars2" style="grid-template-columns:1fr auto auto"><span>Favoritos (precio &gt; 80%)</span><b class="num ${(r.bias.longshot.favorites.gap ?? 0) > 0.05 ? "warn" : ""}">${pctS(r.bias.longshot.favorites.gap)}</b><span class="faint num">${r.bias.longshot.favorites.n}</span></div>
        <p class="help">Cuánto se cumplieron frente a su precio. Negativo en batacazos = los jugadores pagan de más por lo improbable (sesgo clásico de las apuestas).</p></div>
      <div class="panel"><h2>Resultados Sí / No <small>binarios</small></h2>
        ${r.bias.yesNo.length ? r.bias.yesNo.map((y) => { const t = y.yes + y.no || 1; return `<div class="bars2" style="grid-template-columns:110px minmax(0,1fr) 70px" title="${esc(y.name)}: ${y.yes} Sí, ${y.no} No, ${y.void} anulados"><span>${esc(y.name)}</span><span class="bar"><i style="width:${(y.yes / t) * 100}%"></i><b style="left:50%"></b></span><span class="num" style="text-align:right">${y.yes}/${y.no}</span></div>`; }).join("") : `<p class="muted">Sin binarios resueltos todavía.</p>`}
        <p class="help">Si casi todo se resuelve en No (o en Sí), las preguntas pueden estar redactadas con sesgo.</p></div>
      <div class="panel"><h2>Precisión de la apertura <small>por origen</small></h2>
        ${r.bias.openingAccuracy.length ? r.bias.openingAccuracy.map((a) => `<div class="bars2" style="grid-template-columns:1fr auto auto"><span>${esc(a.origin)}</span><b class="num">${bscore(a.brierInitial)}</b><span class="faint num">${a.n}</span></div>`).join("") : `<p class="muted">Sin datos todavía.</p>`}
        <p class="help">Brier de la probabilidad con la que abrió el mercado: compara la IA con el catálogo y los moderadores.</p></div>
    </div>
    <h2 style="font-size:18px;margin:26px 0 10px">Integridad</h2>
    <div class="grid2">
      <div class="panel"><h2>Alertas <small>compras tardías ganadoras y cuentas nuevas</small></h2>
        ${I.alerts.length ? `<div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Mercado</th><th>Jugador</th><th class="num">Monto</th><th>Detalle</th></tr></thead><tbody>${I.alerts.map((a) => `<tr><td><span class="pill disputed">${esc(a.kind)}</span></td><td>${esc(a.title)}</td><td>${esc(a.player)}</td><td class="num">${money(a.amount)}</td><td class="muted" style="font-size:12px">${esc(a.detail)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="ok">Sin alertas.</p>`}
        <p class="help">Compras de $${r.thresholds.alertMinUsd} o más en el lado ganador dentro de los ${r.thresholds.lateWindowMinutes} min previos al cierre o a la propuesta, y cuentas de menos de 7 días que apuestan $${r.thresholds.alertMinUsd * 2} o más en un día. Límite por jugador y mercado: ${r.thresholds.maxStakePerMarketUsd ? "$" + r.thresholds.maxStakePerMarketUsd : "sin límite"}.</p></div>
      <div class="panel"><h2>Resultado de la casa según quién resolvió</h2>
        ${I.houseByResolver.length ? `<div class="tablewrap"><table><thead><tr><th>Propuso</th><th class="num">Eventos</th><th class="num">Casa ganó</th><th class="num">Resultado casa</th></tr></thead><tbody>${I.houseByResolver.map((x) => `<tr><td>${esc(x.proposer)}</td><td class="num">${x.events}</td><td class="num">${x.events ? Math.round((x.house_won / x.events) * 100) : 0}%</td><td class="num ${x.house_pnl >= 0 ? "ok" : "bad"}">${money(x.house_pnl)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Sin resoluciones finalizadas todavía.</p>`}
        <p class="help">La casa es contraparte y además resuelve. Si con un resolutor la casa gana mucho más seguido que con los demás, hay que revisar esas resoluciones.</p></div>
    </div>
    <div class="grid2">
      <div class="panel"><h2>Concentración del dinero <small>mercados abiertos</small></h2>
        ${I.concentration.length ? `<div class="tablewrap"><table><thead><tr><th>Mercado</th><th class="num">Apostado</th><th class="num">Jugadores</th><th class="num">Top 1</th><th class="num">Top 5</th></tr></thead><tbody>${I.concentration.map((c) => `<tr><td>${esc(c.title)}</td><td class="num">${money(c.total)}</td><td class="num">${c.players}</td><td class="num warn">${Math.round(c.top1 * 100)}%</td><td class="num">${Math.round(c.top5 * 100)}%</td></tr>`).join("")}</tbody></table></div>` : `<p class="ok">Ningún mercado depende de uno o pocos jugadores.</p>`}
        <p class="help">Mercados con al menos $${r.thresholds.minVolumeUsd} apostados donde un jugador pone el 50% o más, o los 5 mayores el 80% o más: su precio refleja a pocas personas.</p></div>
      <div class="panel"><h2>Sesgo de hinchada <small>por país del jugador</small></h2>
        ${I.homeBias.length ? `<div class="tablewrap"><table><thead><tr><th>Opción</th><th class="num">Dinero de su país</th><th class="num">Jugadores de su país</th><th class="num">Veces</th></tr></thead><tbody>${I.homeBias.map((b) => `<tr><td>${esc(b.title)}</td><td class="num">${Math.round(b.moneyFromHome * 100)}%</td><td class="num">${Math.round(b.bettorsFromHome * 100)}%</td><td class="num ${b.ratio > 1.3 ? "warn" : ""}">${b.ratio ?? "—"}×</td></tr>`).join("")}</tbody></table></div>`
          : `<p class="muted">${I.countryCoverage ? "Sin sesgo de hinchada detectable todavía." : "Aún no hay jugadores con país. El casino debe enviar <code>country</code> (EC, CO…) al abrir la sesión."}</p>`}
        <p class="help">Cuando una opción es un país, compara qué parte del dinero al Sí viene de jugadores de ese país con qué parte de los jugadores del evento son de ahí. Más de 1,3× indica apuesta de hinchada.</p></div>
    </div>
    <div class="panel" style="margin-top:14px"><h2>Comparación con referencias externas <small>usa “Referencia” en Mercados para agregar</small></h2>
      ${r.external.length ? `<div class="tablewrap"><table><thead><tr><th>Mercado</th><th>Fuente</th><th class="num">Referencia</th><th class="num">Nuestro precio</th><th class="num">Diferencia</th><th>Actualizado</th></tr></thead><tbody>${r.external.map((x) => `<tr><td>${esc(x.title)}</td><td>${esc(x.source)}</td><td class="num">${x.refPrice}%</td><td class="num">${x.ourPrice}%</td><td class="num ${Math.abs(x.diff) >= 10 ? "warn" : ""}">${x.diff > 0 ? "+" : ""}${x.diff} pts</td><td style="white-space:nowrap">${ago(x.capturedAt)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted">Sin referencias todavía. Para eventos que también existen en Polymarket o en casas de apuestas, agrega la referencia desde Mercados.</p>`}
      <p class="help">Diferencias de 10 puntos o más con una fuente con mucho volumen suelen indicar sesgo local o poca liquidez.</p></div>`;
  el.querySelectorAll("#cH button").forEach((b) => (b.onclick = () => { viewCalibracion.h = Number(b.dataset.h); route(); }));
}

// ---------- Arranque ----------
if (A.key) start().catch(() => logout()); else { document.getElementById("login").hidden = false; if (A.api) document.getElementById("lkApi").value = A.api; if (A.user) document.getElementById("lkUser").value = A.user; }
</script>
</body>
</html>
