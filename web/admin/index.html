<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicciones · Back-office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Back-office de Predicciones: barra lateral fija + área de trabajo. Se sirve en /admin/ o se aloja aparte
   (por ejemplo en el dominio del back-office del casino) apuntando a la API con ?api=https://… */
:root {
  --bg: #0d0e11; --side: #121318; --card: #17181d; --card-2: #1f2027; --line: #2a2b33; --grid: #24252c;
  --text: #f1f2f4; --muted: #9a9ca8; --faint: #6c6e79;
  --brand: #ffd400; --brand-ink: #111;
  --ok: #2bb560; --ok-txt: #6ee08f; --warn: #f2a93b; --bad: #ef5350; --bad-txt: #ff8a8c; --info: #60a5fa;
  --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
a { color: var(--info); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.ok { color: var(--ok-txt); } .bad { color: var(--bad-txt); } .warn { color: var(--warn); }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } .side { position: static !important; height: auto !important; } .nav { flex-direction: row !important; overflow-x: auto; } .nav a { white-space: nowrap; } .side .foot { display: none; } }
.side { background: var(--side); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 16px 12px; gap: 18px; }
.brand { font-weight: 800; font-size: 18px; padding: 0 8px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-style: normal; font-size: 14px; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 600; }
.nav a:hover { background: var(--card); color: var(--text); }
.nav a.on { background: var(--card-2); color: var(--text); box-shadow: inset 3px 0 0 var(--brand); }
.nav .count { font-family: var(--mono); font-size: 11px; background: var(--brand); color: var(--brand-ink); border-radius: 999px; padding: 1px 7px; }
.side .foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }

main { padding: 22px 26px 60px; min-width: 0; }
@media (max-width: 560px) { main { padding: 16px; } }
.head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 24px; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.btn { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: #3a3b45; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.ok { background: color-mix(in srgb, var(--ok) 22%, var(--card)); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); color: var(--ok-txt); }
.btn.bad { background: color-mix(in srgb, var(--bad) 18%, var(--card)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); color: var(--bad-txt); }
.btn.sm { padding: 5px 9px; font-size: 12px; }
.input, select.input, textarea.input { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea.input { min-height: 84px; resize: vertical; line-height: 1.45; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
label.f > span em { font-style: normal; color: var(--faint); font-weight: 500; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.kpi .v { font-family: var(--mono); font-size: 24px; font-weight: 700; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.kpi.attn { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h2 small { color: var(--muted); font-weight: 500; font-size: 12px; }

.cov { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
.cov .bar { position: relative; height: 12px; background: var(--card-2); border-radius: 3px; }
.cov .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ok); }
.cov .bar i.p { background: var(--brand); opacity: .55; }
.cov .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .7; }
.cov .n { text-align: right; font-family: var(--mono); font-size: 12px; }

.chart svg text { fill: var(--faint); font-family: var(--mono); font-size: 10px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); position: sticky; top: 0; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td .t { font-weight: 600; max-width: 460px; min-width: 240px; }
a.btn { text-decoration: none; display: inline-block; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card-2); white-space: nowrap; }
.pill.open { color: var(--ok-txt); } .pill.closed, .pill.resolving, .pill.proposed { color: var(--warn); } .pill.disputed, .pill.void, .pill.error { color: var(--bad-txt); } .pill.resolved, .pill.finalized { color: var(--info); }
.opts { display: flex; flex-wrap: wrap; gap: 4px; }
.opt { font-size: 11px; background: var(--card-2); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.opt b { font-family: var(--mono); }

/* Diseñador */
.designer { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); gap: 16px; align-items: start; }
@media (max-width: 1100px) { .designer { grid-template-columns: minmax(0, 1fr); } }
.form { display: flex; flex-direction: column; gap: 14px; }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .form .two { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: var(--card-2); border-radius: 8px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--bg); color: var(--text); }
.outrow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 34px; gap: 8px; align-items: center; }
.outrow input[type=range] { width: 100%; accent-color: var(--brand); }
.sum { font-size: 12px; font-family: var(--mono); }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.checks div::before { margin-right: 6px; }
.checks .y::before { content: "✓"; color: var(--ok-txt); } .checks .n::before { content: "✕"; color: var(--bad-txt); }
.preview { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
.pcard { background: #17171a; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pcard .pic { height: 84px; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #3a3000, #0b0b0c 75%); position: relative; }
.pcard .pic img { width: 100%; height: 100%; object-fit: cover; }
.pcard .badge { position: absolute; left: 8px; bottom: -9px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 999px; color: #111; background: var(--brand); }
.pcard .body { padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.pcard .q { font-weight: 600; font-size: 15px; line-height: 1.3; }
.pcard .big { font-family: var(--mono); font-weight: 700; font-size: 20px; }
.pcard .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: var(--mono); font-size: 12px; }
.pcard .yn span { border-radius: 6px; padding: 6px; text-align: center; }
.pcard .yn .y { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok-txt); }
.pcard .yn .n { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad-txt); }
.pcard .mo { position: relative; display: flex; justify-content: space-between; font-size: 12px; padding: 5px 8px; border-radius: 6px; background: var(--card-2); overflow: hidden; }
.pcard .mo i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--brand) 16%, transparent); }
.pcard .mo span, .pcard .mo b { position: relative; }
.rules { font-size: 12px; color: var(--muted); line-height: 1.5; background: var(--card-2); border-radius: 10px; padding: 10px 12px; }
.rules b { color: var(--text); }

.cards { display: flex; flex-direction: column; gap: 10px; }
.dcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.dcard h3 { margin: 0 0 6px; font-size: 15px; }
.dcard .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.dcard details { font-size: 12px; color: var(--muted); margin-top: 8px; }
.dcard details p { margin: 6px 0; line-height: 1.45; }
.dcard .acts { display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 700px) { .dcard { grid-template-columns: 22px minmax(0, 1fr); } .dcard .acts { grid-column: 2; flex-direction: row; flex-wrap: wrap; } }
.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal h3 { margin: 0; font-size: 17px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; z-index: 60; max-width: 420px; font-size: 13px; }
.toast.err { border-color: var(--bad); }
.login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
.login .panel { width: min(400px, 100%); display: flex; flex-direction: column; gap: 12px; }
.creds { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; word-break: break-all; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form class="panel" id="loginForm">
    <div class="brand"><i>P</i><div>Predicciones<small>Back-office</small></div></div>
    <label class="f"><span>Clave de administración (ADMIN_API_KEY)</span><input class="input" id="lkKey" type="password" required autocomplete="current-password"></label>
    <label class="f"><span>Tu nombre <em>(queda registrado en aprobaciones y resoluciones)</em></span><input class="input" id="lkUser" required autocomplete="username"></label>
    <label class="f"><span>URL de la API <em>(vacío = este mismo servidor)</em></span><input class="input" id="lkApi" placeholder="https://api.predicciones.tu-dominio.com"></label>
    <button class="btn primary" type="submit">Entrar</button>
    <div class="bad" id="lkErr" role="alert"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><i>P</i><div>Predicciones<small>Back-office</small></div></div>
    <nav class="nav" id="nav">
      <a href="#resumen" data-v="resumen">Resumen</a>
      <a href="#disenar" data-v="disenar">Diseñar mercado</a>
      <a href="#moderacion" data-v="moderacion">Moderación <span class="count" id="cDrafts" hidden></span></a>
      <a href="#mercados" data-v="mercados">Mercados</a>
      <a href="#resoluciones" data-v="resoluciones">Resoluciones <span class="count" id="cRes" hidden></span></a>
      <a href="#tendencias" data-v="tendencias">Tendencias y señales</a>
      <a href="#fuentes" data-v="fuentes">Fuentes</a>
      <a href="#riesgo" data-v="riesgo">Riesgo de la casa</a>
      <a href="#operadores" data-v="operadores">Casinos</a>
    </nav>
    <div class="foot"><span id="whoami"></span><span id="apiInfo"></span><button class="btn sm" id="logout" type="button">Salir</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ---------- Estado y utilidades ----------
const qs = new URLSearchParams(location.search);
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };
const A = { key: store.get("pa_key"), user: store.get("pa_user"), api: qs.get("api") ?? store.get("pa_api") ?? "" };
let CATS = [], OV = null, VIEW = "resumen", DESIGN = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (m) => "$" + (Number(m) / 1e6).toLocaleString("es-EC", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const kmoney = (m) => { const u = Number(m) / 1e6; return u >= 1e6 ? "$" + (u / 1e6).toLocaleString("es-EC", { maximumFractionDigits: 2 }) + " M" : u >= 1e4 ? "$" + (u / 1e3).toLocaleString("es-EC", { maximumFractionDigits: 1 }) + " k" : "$" + u.toLocaleString("es-EC", { maximumFractionDigits: 2 }); };
const fdate = (d) => d ? new Date(d).toLocaleString("es-EC", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const fday = (d) => d ? new Date(d).toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" }) : "—";
const catName = (s) => CATS.find((c) => c.slug === s)?.name ?? s;
const ago = (d) => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };
const until = (d) => { const m = Math.round((new Date(d) - Date.now()) / 60000); return m <= 0 ? "terminó" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };
const STATUS = { open: "Abierto", closed: "Cerrado", resolving: "En resolución", resolved: "Resuelto", void: "Anulado", proposed: "Propuesta", disputed: "Disputada", finalized: "Finalizada", rejected: "Rechazada", pending: "Pendiente", approved: "Aprobado" };
const pill = (s) => `<span class="pill ${esc(s)}">${esc(STATUS[s] ?? s)}</span>`;

function toast(msg, err) { const t = document.getElementById("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 4500); }

async function api(path, opts = {}) {
  const r = await fetch(A.api.replace(/\/$/, "") + path, { ...opts, headers: { "content-type": "application/json", "x-admin-key": A.key ?? "", "x-admin-user": A.user ?? "", ...(opts.headers ?? {}) }, body: opts.body && typeof opts.body !== "string" ? JSON.stringify(opts.body) : opts.body });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error("Sesión de administración inválida"); }
  if (!r.ok) throw new Error(body.message ?? `Error ${r.status}`);
  return body;
}
async function run(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); return r; }
  catch (e) { toast(e.message, true); }
  finally { if (btn) btn.disabled = false; }
}

/** Ventana modal con formulario. fields: [{id,label,type,options,value,placeholder}] -> devuelve objeto o null. */
function modal({ title, text = "", fields = [], ok = "Confirmar", danger = false }) {
  return new Promise((resolve) => {
    const root = document.getElementById("modalRoot");
    root.innerHTML = `<div class="modal-bg"><form class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text ? `<div class="muted" style="line-height:1.5">${text}</div>` : ""}
      ${fields.map((f) => `<label class="f"><span>${esc(f.label)}</span>${f.type === "select" ? `<select class="input" id="m_${f.id}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.value ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>` : f.type === "textarea" ? `<textarea class="input" id="m_${f.id}" placeholder="${esc(f.placeholder ?? "")}">${esc(f.value ?? "")}</textarea>` : f.type === "checkbox" ? `<span class="row"><input type="checkbox" id="m_${f.id}" ${f.value ? "checked" : ""}> ${esc(f.hint ?? "")}</span>` : `<input class="input" id="m_${f.id}" type="${f.type ?? "text"}" value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder ?? "")}">`}</label>`).join("")}
      <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-x>Cancelar</button><button class="btn ${danger ? "bad" : "primary"}" type="submit">${esc(ok)}</button></div></form></div>`;
    const form = root.querySelector("form");
    const close = (v) => { root.innerHTML = ""; resolve(v); };
    root.querySelector("[data-x]").onclick = () => close(null);
    root.querySelector(".modal-bg").onclick = (e) => { if (e.target.classList.contains("modal-bg")) close(null); };
    form.onsubmit = (e) => { e.preventDefault(); const out = {}; for (const f of fields) { const el = document.getElementById("m_" + f.id); out[f.id] = f.type === "checkbox" ? el.checked : el.value; } close(out); };
    (form.querySelector("input,select,textarea") ?? form.querySelector("button[type=submit]")).focus();
  });
}

function barChart(data, { h = 140, fmt = (v) => v, label = "" } = {}) {
  const W = 600, pad = { l: 4, r: 4, t: 8, b: 18 }, max = Math.max(1, ...data.map((d) => d.v));
  const bw = (W - pad.l - pad.r) / data.length;
  const bars = data.map((d, i) => { const bh = (d.v / max) * (h - pad.t - pad.b); return `<rect x="${pad.l + i * bw + 1}" y="${h - pad.b - bh}" width="${Math.max(1, bw - 2)}" height="${bh}" rx="2" fill="var(--brand)" opacity="${d.v ? .85 : .2}"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></rect>`; }).join("");
  const ticks = data.map((d, i) => i % 4 === 0 ? `<text x="${pad.l + i * bw + bw / 2}" y="${h - 4}" text-anchor="middle">${esc(d.short)}</text>` : "").join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${bars}${ticks}</svg></div>`;
}

// ---------- Sesión ----------
function logout() { store.del("pa_key"); A.key = null; document.getElementById("app").hidden = true; document.getElementById("login").hidden = false; }
document.getElementById("logout").onclick = logout;
document.getElementById("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  A.key = document.getElementById("lkKey").value.trim(); A.user = document.getElementById("lkUser").value.trim(); A.api = document.getElementById("lkApi").value.trim();
  try { await fetch(A.api.replace(/\/$/, "") + "/admin/overview", { headers: { "x-admin-key": A.key } }).then((r) => { if (!r.ok) throw new Error(r.status === 401 ? "Clave incorrecta" : `No se pudo conectar (${r.status})`); }); }
  catch (err) { document.getElementById("lkErr").textContent = err.message.includes("fetch") ? "No se pudo conectar con la API. Revisa la URL." : err.message; return; }
  store.set("pa_key", A.key); store.set("pa_user", A.user); store.set("pa_api", A.api);
  start();
};

// ---------- Diseñador ----------
const blankDesign = () => ({ title: "", description: "", category: CATS[0]?.slug ?? "politica", kind: "binary", yes: 0.5,
  outcomes: [{ label: "", probability: 0.34 }, { label: "", probability: 0.33 }, { label: "Otro", probability: 0.33 }],
  closeTime: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 16), resolutionCriteria: "", resolutionSource: "", imageUrl: "", tags: "", featured: false, draftId: null });

function designFromPayload(p, draftId = null) {
  const multi = p.kind === "multi";
  return { ...blankDesign(), title: p.title ?? "", description: p.description ?? "", category: p.category, kind: p.kind ?? "binary",
    yes: multi ? 0.5 : p.outcomes?.[0]?.probability ?? 0.5, outcomes: multi ? p.outcomes.map((o) => ({ label: o.label, probability: o.probability })) : blankDesign().outcomes,
    closeTime: p.closeTime ? new Date(new Date(p.closeTime).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : blankDesign().closeTime,
    resolutionCriteria: p.resolutionCriteria ?? "", resolutionSource: p.resolutionSource ?? "", imageUrl: p.imageUrl ?? "", tags: (p.tags ?? []).join(", "), featured: !!p.featured, draftId };
}
function designPayload(d) {
  return { title: d.title.trim(), description: d.description.trim(), category: d.category, kind: d.kind,
    outcomes: d.kind === "binary" ? [{ label: "Sí", probability: Number(d.yes) }] : d.outcomes.filter((o) => o.label.trim()).map((o) => ({ label: o.label.trim(), probability: Number(o.probability) })),
    closeTime: new Date(d.closeTime).toISOString(), resolutionCriteria: d.resolutionCriteria.trim(), resolutionSource: d.resolutionSource.trim(),
    ...(d.imageUrl.trim() ? { imageUrl: d.imageUrl.trim() } : {}), tags: d.tags.split(",").map((t) => t.trim()).filter(Boolean), featured: d.featured };
}
function designChecks(d) {
  const p = designPayload(d), close = new Date(d.closeTime);
  const sum = p.outcomes.reduce((a, o) => a + o.probability, 0);
  return [
    [/^¿.{6,}\?$/.test(p.title), "La pregunta empieza con ¿ y termina con ?"],
    [p.title.length <= 200, "Máximo 200 caracteres"],
    [close > new Date(Date.now() + 3600e3), "Cierra al menos 1 hora en el futuro"],
    [p.kind === "binary" || (p.outcomes.length >= 2 && p.outcomes.length <= 20), "Opción múltiple: entre 2 y 20 opciones con nombre"],
    [p.kind === "binary" || Math.abs(sum - 1) <= 0.02, `Las probabilidades suman 100% (ahora ${Math.round(sum * 100)}%)`],
    [p.outcomes.every((o) => o.probability >= 0.01 && o.probability <= 0.99), "Cada probabilidad entre 1% y 99%"],
    [p.resolutionCriteria.length >= 10, "Criterio de resolución claro (mín. 10 caracteres)"],
    [p.resolutionSource.length >= 3, "Fuente oficial que decide"],
  ];
}

      <td class="num">${kmoney(e.volume)}</td><td class="num">${e.traders}</td><td style="white-space:nowrap">${fday(e.closeTime)}</td><td>${pill(e.status)}</td>
      <td><div class="row" style="flex-wrap:nowrap">

        ${e.status === "open" ? `<button class="btn sm" data-feat="${e.id}" data-v="${e.featured ? 0 : 1}">${e.featured ? "Quitar ★" : "Destacar"}</button><button class="btn sm" data-close="${e.id}">Cerrar</button>` : ""}

    location.hash = "#disenar"; }));

async function resolveDialog(e, btn) {
  const options = e.kind === "multi" ? [...e.markets.map((m) => [String(m.id), `Gana: ${m.label}`]), ["VOID", "Anular (paga $0,50 por acción)"]] : [["YES", "Sí"], ["NO", "No"], ["VOID", "Anular (paga $0,50 por acción)"]];
  const fields = [{ id: "result", label: "Resultado", type: "select", options }, { id: "explanation", label: "Explicación (la verán los jugadores)", type: "textarea" }, { id: "url", label: "Evidencia (URL de la fuente oficial)", type: "url", placeholder: "https://" }];
  const r = await modal({ title: "Proponer resolución", text: `<b>${esc(e.title)}</b><br>Fuente: ${esc(e.resolutionSource)}<br>Se detiene el trading y corre la ventana de disputa antes de pagar.${OV?.aiEnabled ? "" : ""}`, fields, ok: "Proponer" });
  if (!r) return;
  const body = { explanation: r.explanation, evidence: r.url ? [{ url: r.url }] : [] };
  if (r.result === "VOID" || r.result === "YES" || r.result === "NO") body.outcome = r.result; else body.winningMarketId = Number(r.result);
  run(btn, () => api(`/admin/events/${e.id}/resolve`, { method: "POST", body }), "Propuesta creada. Corre la ventana de disputa.").then(async (x) => { if (x) { await refreshCounts(); route(); } });
}

  el.innerHTML = `<div class="head"><div><h1>Riesgo de la casa</h1><p>El market maker de la casa da liquidez a ambos lados. Aquí ves su inventario y dinero comprometido por mercado.</p></div><button class="btn" id="mmRefresh">Recotizar ahora</button></div>
    <div class="kpis" style="margin-bottom:14px"><div class="kpi"><span class="k">Comprometido en posiciones</span><span class="v">${kmoney(r.house.open_cost)}</span></div><div class="kpi"><span class="k">Resultado realizado</span><span class="v ${r.house.realized >= 0 ? "ok" : "bad"}">${money(r.house.realized)}</span></div><div class="kpi"><span class="k">Comisiones cobradas</span><span class="v">${money(r.house.fees)}</span></div><div class="kpi"><span class="k">Mercados con exposición</span><span class="v">${rows.filter((m) => m.house_cost > 0).length}</span></div></div>
    <div class="tablewrap"><table><thead><tr><th>Mercado</th><th>Estado</th><th class="num">Precio</th><th class="num">Justo</th><th class="num">Casa Sí</th><th class="num">Casa No</th><th class="num">Comprometido</th><th class="num">Jugadores Sí / No</th><th class="num">Volumen</th></tr></thead><tbody>
    ${rows.length ? rows.slice(0, 200).map((m) => `<tr><td><div class="t">${esc(m.question)}</div></td><td>${pill(m.status)}</td><td class="num">${m.last_price}¢</td><td class="num">${m.fair_price}¢</td><td class="num">${(m.house_yes / 100).toLocaleString("es-EC")}</td><td class="num">${(m.house_no / 100).toLocaleString("es-EC")}</td><td class="num">${money(m.house_cost)}</td><td class="num">${(m.players_yes / 100).toLocaleString("es-EC")} / ${(m.players_no / 100).toLocaleString("es-EC")}</td><td class="num">${kmoney(m.volume)}</td></tr>`).join("") : `<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">Sin exposición todavía.</td></tr>`}
    </tbody></table></div>`;
  el.querySelector("#mmRefresh").onclick = (e) => run(e.target, () => api("/admin/mm/refresh", { method: "POST", body: {} }), (x) => `${x.markets} mercados recotizados`).then(() => route());
}

// ---------- Casinos ----------
async function viewOperadores(el) {
  const ops = await api("/admin/operators");
  el.innerHTML = `<div class="head"><div><h1>Casinos</h1><p>Operadores integrados por API. Cada uno usa su propia billetera, marca y comisión.</p></div><button class="btn primary" id="oAdd">+ Agregar casino</button></div>
    <div id="oCreds"></div>
    <div class="tablewrap"><table><thead><tr><th>Casino</th><th>Clave pública</th><th>Billetera</th><th>Webhook</th><th class="num">Comisión</th><th>Moneda</th><th>Estado</th></tr></thead><tbody>
    ${ops.length ? ops.map((o) => `<tr><td><div class="t">${esc(o.theme?.brandName ?? o.name)}</div><span class="faint" style="font-size:11px">${esc(o.id)}</span></td><td class="num" style="font-size:12px">${esc(o.api_key)}</td><td style="font-size:12px;word-break:break-all">${esc(o.wallet_url)}</td><td style="font-size:12px;word-break:break-all">${esc(o.webhook_url ?? "—")}</td><td class="num">${o.fee_bps == null ? "Global" : (o.fee_bps / 100).toFixed(2) + "%"}</td><td>${esc(o.currency)}</td><td>${o.active ? `<span class="pill open">Activo</span>` : `<span class="pill void">Inactivo</span>`}</td></tr>`).join("") : `<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Aún no hay casinos.</td></tr>`}
    </tbody></table></div>`;
  el.querySelector("#oAdd").onclick = async () => {
    const r = await modal({ title: "Agregar casino", ok: "Crear credenciales", fields: [
      { id: "id", label: "Identificador (minúsculas y guiones)", placeholder: "ecuabet" }, { id: "name", label: "Nombre", placeholder: "Ecuabet" },
      { id: "walletUrl", label: "URL de la billetera", type: "url", placeholder: "https://api.casino.com/predicciones/wallet" }, { id: "webhookUrl", label: "URL de webhooks (opcional)", type: "url" },
      { id: "feeBps", label: "Comisión en puntos básicos (200 = 2%, vacío = global)", type: "number" }, { id: "primary", label: "Color de marca", type: "color", value: "#ffd400" }] });
    if (!r) return;
    const out = await run(null, () => api("/admin/operators", { method: "POST", body: { id: r.id, name: r.name, walletUrl: r.walletUrl, ...(r.webhookUrl ? { webhookUrl: r.webhookUrl } : {}), ...(r.feeBps ? { feeBps: Number(r.feeBps) } : {}), theme: { brandName: r.name, primary: r.primary } } }), "Casino creado");
    if (!out) return;
    await viewOperadores(el);
    el.querySelector("#oCreds").innerHTML = `<div class="panel" style="margin-bottom:14px;border-color:var(--brand)"><h2>Credenciales de ${esc(out.id)} <small>se muestran una sola vez</small></h2>
      <div class="creds"><span>X-Operator-Key: <b>${esc(out.apiKey)}</b></span><span>API secret: <b>${esc(out.apiSecret)}</b></span><span>Wallet secret: <b>${esc(out.walletSecret)}</b></span></div>
      <div class="row" style="margin-top:10px"><button class="btn sm" id="oCopy">Copiar</button><span class="faint" style="font-size:12px">Envíalas al casino por un canal seguro junto con la guía de integración.</span></div></div>`;
    el.querySelector("#oCopy").onclick = () => navigator.clipboard?.writeText(`X-Operator-Key: ${out.apiKey}\nAPI secret: ${out.apiSecret}\nWallet secret: ${out.walletSecret}`).then(() => toast("Copiado"), () => toast("Selecciona y copia el texto manualmente", true));
  };
}

// ---------- Arranque ----------
if (A.key) start().catch(() => logout()); else { document.getElementById("login").hidden = false; if (A.api) document.getElementById("lkApi").value = A.api; if (A.user) document.getElementById("lkUser").value = A.user; }
</script>
</body>
