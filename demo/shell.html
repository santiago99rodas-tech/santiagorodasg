<title>Predicciones Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;1,900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Casino de demostración: barra del casino arriba y, debajo, el módulo de Predicciones o el back-office
   (cada uno en su propio iframe). Tema oscuro único, igual que el producto. */
:root { --bg:#0b0b0c; --card:#17171a; --line:#2c2c31; --text:#f4f4f5; --muted:#a1a1aa; --brand:#ffd400; --ink:#111;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; display:flex; flex-direction:column; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg); }
.bar { border-bottom:1px solid var(--line); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:10px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.logo { font-weight:900; font-style:italic; font-size:21px; color:var(--brand); }
nav { display:flex; gap:4px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
nav button { font:inherit; color:var(--muted); background:none; border:0; padding:8px 12px; border-radius:8px; font-weight:600; white-space:nowrap; cursor:pointer; }
nav button.on { background:var(--brand); color:var(--ink); }
nav button.bo { margin-left:auto; border:1px solid var(--line); color:var(--text); }
nav button.bo.on { background:var(--text); color:var(--ink); border-color:var(--text); }
nav button:focus-visible, .note button:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.who { display:flex; align-items:center; gap:10px; font-size:13px; }
.bal { font-family:var(--mono); background:var(--card); border:1px solid var(--line); padding:6px 10px; border-radius:8px; white-space:nowrap; }
.note { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:6px; }
.note b { color:var(--text); }
.note button { font:inherit; font-size:12px; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; }
.stage { flex:1; min-height:0; position:relative; }
.stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
.placeholder { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--muted); }
.placeholder h2 { color:var(--text); margin:0 0 8px; font-size:20px; }
.loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); }
@media (max-width:640px) { .who span:first-child { display:none; } .note .hint { display:none; } }
</style>

<header class="bar">
  <span class="logo">Casino Demo</span>
  <nav aria-label="Secciones del casino">
    <button type="button" data-v="casino">Casino</button>
    <button type="button" data-v="vivo">En vivo</button>
    <button type="button" data-v="deportes">Deportes</button>
    <button type="button" data-v="pred" class="on">Predicciones</button>
    <button type="button" data-v="admin" class="bo">Back-office</button>
  </nav>
  <div class="who"><span>Santiago Rodas</span><span class="bal">Saldo casino: <b id="bal">$500.00</b></span></div>
</header>
<div class="note"><span><b>Demo en vivo:</b> el motor de órdenes, el market maker de la casa, la billetera y las resoluciones corren aquí mismo, en tu navegador. <span class="hint">Apuesta, vende o resuelve mercados desde el back-office. Se reinicia al recargar.</span></span>
  <button type="button" id="bots">Jugadores simulados: activos</button></div>
<main class="stage" id="stage"><div class="loading" id="loading">Cargando 700 mercados…</div></main>

<script>
/*__DATA__*/
</script>
<script>
/*__BACKEND__*/
</script>
<script>
/*__PAGES__*/
(function () {
  const stage = document.getElementById("stage");
  const frames = {};
  const placeholders = {
    casino: ["Casino", "Esta pestaña es del casino anfitrión. El módulo nuevo vive en Predicciones."],
    vivo: ["Casino en vivo", "Esta pestaña es del casino anfitrión. El módulo nuevo vive en Predicciones."],
    deportes: ["Deportes", "Esta pestaña es del casino anfitrión. El módulo nuevo vive en Predicciones."],
  };
  function show(v) {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    Object.values(frames).forEach((f) => (f.hidden = true));
    stage.querySelectorAll(".placeholder").forEach((p) => p.remove());
    if (v === "pred" || v === "admin") {
      if (!frames[v]) {
        const f = document.createElement("iframe");
        f.title = v === "pred" ? "Predicciones" : "Back-office de Predicciones";
        f.srcdoc = v === "pred" ? EMBED_HTML : ADMIN_HTML;
        stage.appendChild(f);
        frames[v] = f;
      }
      frames[v].hidden = false;
    } else {
      const [h, t] = placeholders[v];
      stage.insertAdjacentHTML("beforeend", `<div class="placeholder"><div><h2>${h}</h2><p>${t}</p></div></div>`);
    }
  }
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.v)));
  document.getElementById("loading").remove();
  show(location.hash === "#backoffice" ? "admin" : "pred");

  const bal = document.getElementById("bal");
  const fmt = (m) => "$" + (m / 1e6).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  setInterval(() => (bal.textContent = fmt(DEMO.balance())), 1000);

  const botsBtn = document.getElementById("bots");
  botsBtn.addEventListener("click", () => { DEMO.setBots(!DEMO.botsOn()); botsBtn.textContent = `Jugadores simulados: ${DEMO.botsOn() ? "activos" : "en pausa"}`; });
})();
</script>
