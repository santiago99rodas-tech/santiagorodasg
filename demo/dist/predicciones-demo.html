checks .y::before { content: \"✓\"; color: var(--ok-txt); } .checks .n::before { content: \"✕\"; color: var(--bad-txt); }\r\n.preview { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }\r\n.pcard { background: #17171a; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }\r\n.pcard .pic { height: 84px; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #3a3000, #0b0b0c 75%); position: relative; }\r\n.pcard .pic img { width: 100%; height: 100%; object-fit: cover; }\r\n.pcard .badge { position: absolute; left: 8px; bottom: -9px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 999px; color: #111; background: var(--brand); }\r\n.pcard .body { padding: 14px 12px 12px; display: flex; flex-direction: column; gap: 8px; }\r\n.pcard .q { font-weight: 600; font-size: 15px; line-height: 1.3; }\r\n.pcard .big { font-family: var(--mono); font-weight: 700; font-size: 20px; }\r\n.pcard .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: var(--mono); font-size: 12px; }\r\n.pcard .yn span { border-radius: 6px; padding: 6px; text-align: center; }\r\n.pcard .yn .y { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok-txt); }\r\n.pcard .yn .n { background: color-mix(in srgb, var(--bad) 20%, transparent); color: var(--bad-txt); }\r\n.pcard .mo { position: relative; display: flex; justify-content: space-between; font-size: 12px; padding: 5px 8px; border-radius: 6px; background: var(--card-2); overflow: hidden; }\r\n.pcard .mo i { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--brand) 16%, transparent); }\r\n.pcard .mo span, .pcard .mo b { position: relative; }\r\n.rules { font-size: 12px; color: var(--muted); line-height: 1.5; background: var(--card-2); border-radius: 10px; padding: 10px 12px; }\r\n.rules b { color: var(--text); }\r\n\r\n.cards { display: flex; flex-direction: column; gap: 10px; }\r\n.dcard { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; }\r\n.dcard h3 { margin: 0 0 6px; font-size: 15px; }\r\n.dcard .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }\r\n.dcard details { font-size: 12px; color: var(--muted); margin-top: 8px; }\r\n.dcard details p { margin: 6px 0; line-height: 1.45; }\r\n.dcard .acts { display: flex; flex-direction: column; gap: 6px; }\r\n@media (max-width: 700px) { .dcard { grid-template-columns: 22px minmax(0, 1fr); } .dcard .acts { grid-column: 2; flex-direction: row; flex-wrap: wrap; } }\r\n.empty { color: var(--muted); padding: 28px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }\r\n\r\n.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: grid; place-items: center; z-index: 50; padding: 16px; }\r\n.modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }\r\n.modal h3 { margin: 0; font-size: 17px; }\r\n.toast { position: fixed; right: 18px; bottom: 18px; background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; z-index: 60; max-width: 420px; font-size: 13px; }\r\n.toast.err { border-color: var(--bad); }\r\n.login { min-height: 100%; display: grid; place-items: center; padding: 16px; }\r\n.login .panel { width: min(400px, 100%); display: flex; flex-direction: column; gap: 12px; }\r\n.creds { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; word-break: break-all; display: flex; flex-direction: column; gap: 6px; }\r\n</style>\r\n</head>\r\n<body>\r\n<div class=\"login\" id=\"login\" hidden>\r\n  <form class=\"panel\" id=\"loginForm\">\r\n    <div class=\"brand\"><i>P</i><div>Predicciones<small>Back-office</small></div></div>\r\n    <label class=\"f\"><span>Clave de administración (ADMIN_API_KEY)</span><input class=\"input\" id=\"lkKey\" type=\"password\" required autocomplete=\"current-password\"></label>\r\n    <label class=\"f\"><span>Tu nombre <em>(queda registrado en aprobaciones y resoluciones)</em></span><input class=\"input\" id=\"lkUser\" required autocomplete=\"username\"></label>\r\n    <label class=\"f\"><span>URL de la API <em>(vacío = este mismo servidor)</em></span><input class=\"input\" id=\"lkApi\" placeholder=\"https://api.predicciones.tu-dominio.com\"></label>\r\n    <button class=\"btn primary\" type=\"submit\">Entrar</button>\r\n    <div class=\"bad\" id=\"lkErr\" role=\"alert\"></div>\r\n  </form>\r\n</div>\r\n\r\n<div class=\"app\" id=\"app\" hidden>\r\n  <aside class=\"side\">\r\n    <div class=\"brand\"><i>P</i><div>Predicciones<small>Back-office</small></div></div>\r\n    <nav class=\"nav\" id=\"nav\">\r\n      <a href=\"#resumen\" data-v=\"resumen\">Resumen</a>\r\n      <a href=\"#disenar\" data-v=\"disenar\">Diseñar mercado</a>\r\n      <a href=\"#moderacion\" data-v=\"moderacion\">Moderación <span class=\"count\" id=\"cDrafts\" hidden></span></a>\r\n      <a href=\"#mercados\" data-v=\"mercados\">Mercados</a>\r\n      <a href=\"#resoluciones\" data-v=\"resoluciones\">Resoluciones <span class=\"count\" id=\"cRes\" hidden></span></a>\r\n      <a href=\"#tendencias\" data-v=\"tendencias\">Tendencias y señales</a>\r\n      <a href=\"#fuentes\" data-v=\"fuentes\">Fuentes</a>\r\n      <a href=\"#riesgo\" data-v=\"riesgo\">Riesgo de la casa</a>\r\n      <a href=\"#operadores\" data-v=\"operadores\">Casinos</a>\r\n    </nav>\r\n    <div class=\"foot\"><span id=\"whoami\"></span><span id=\"apiInfo\"></span><button class=\"btn sm\" id=\"logout\" type=\"button\">Salir</button></div>\r\n  </aside>\r\n  <main id=\"main\"></main>\r\n</div>\r\n<div id=\"modalRoot\"></div>\r\n<div class=\"toast\" id=\"toast\" hidden role=\"status\"></div>\r\n\r\n<script>\r\n// ---------- Estado y utilidades ----------\r\nconst qs = new URLSearchParams(location.search);\r\nconst store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} }, del: (k) => { try { sessionStorage.removeItem(k); } catch {} } };\r\n// La URL de la API puede venir fijada en el HTML (<meta name=\"predicciones-api\">) cuando el panel se aloja en otro dominio\r\nconst DEFAULT_API = document.querySelector('meta[name=\"predicciones-api\"]')?.content ?? \"\";\r\nconst A = { key: \"demo\", user: \"Demo\", api: \"\" };\r\nlet CATS = [], OV = null, VIEW = \"resumen\", DESIGN = null;\r\n\r\nconst esc = (s) => String(s ?? \"\").replace(/[&<>\"]/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\r\nconst money = (m) => \"$\" + (Number(m) / 1e6).toLocaleString(\"es-EC\", { minimumFractionDigits: 2, maximumFractionDigits: 2 });\r\nconst kmoney = (m) => { const u = Number(m) / 1e6; return u >= 1e6 ? \"$\" + (u / 1e6).toLocaleString(\"es-EC\", { maximumFractionDigits: 2 }) + \" M\" : u >= 1e4 ? \"$\" + (u / 1e3).toLocaleString(\"es-EC\", { maximumFractionDigits: 1 }) + \" k\" : \"$\" + u.toLocaleString(\"es-EC\", { maximumFractionDigits: 2 }); };\r\nconst fdate = (d) => d ? new Date(d).toLocaleString(\"es-EC\", { day: \"numeric\", month: \"short\", year: \"numeric\", hour: \"2-digit\", minute: \"2-digit\" }) : \"—\";\r\nconst fday = (d) => d ? new Date(d).toLocaleDateString(\"es-EC\", { day: \"numeric\", month: \"short\", year: \"numeric\" }) : \"—\";\r\nconst catName = (s) => CATS.find((c) => c.slug === s)?.name ?? s;\r\nconst ago = (d) => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} d`; };\r\nconst until = (d) => { const m = Math.round((new Date(d) - Date.now()) / 60000); return m <= 0 ? \"terminó\" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`; };\r\nconst STATUS = { open: \"Abierto\", closed: \"Cerrado\", resolving: \"En resolución\", resolved: \"Resuelto\", void: \"Anulado\", proposed: \"Propuesta\", disputed: \"Disputada\", finalized: \"Finalizada\", rejected: \"Rechazada\", pending: \"Pendiente\", approved: \"Aprobado\" };\r\nconst pill = (s) => `<span class=\"pill ${esc(s)}\">${esc(STATUS[s] ?? s)}</span>`;\r\n\r\nfunction toast(msg, err) { const t = document.getElementById(\"toast\"); t.textContent = msg; t.className = \"toast\" + (err ? \" err\" : \"\"); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 4500); }\r\n\r\nasync function api(path, opts = {}) {\r\n  const r = await fetch(A.api.replace(/\\/$/, \"\") + path, { ...opts, headers: { \"content-type\": \"application/json\", \"x-admin-key\": A.key ?? \"\", \"x-admin-user\": A.user ?? \"\", ...(opts.headers ?? {}) }, body: opts.body && typeof opts.body !== \"string\" ? JSON.stringify(opts.body) : opts.body });\r\n  const body = await r.json().catch(() => ({}));\r\n  if (r.status === 401) { logout(); throw new Error(\"Sesión de administración inválida\"); }\r\n  if (!r.ok) throw new Error(body.message ?? `Error ${r.status}`);\r\n  return body;\r\n}\r\nasync function run(btn, fn, okMsg) {\r\n  if (btn) btn.disabled = true;\r\n  try { const r = await fn(); if (okMsg) toast(typeof okMsg === \"function\" ? okMsg(r) : okMsg); return r; }\r\n  catch (e) { toast(e.message, true); }\r\n  finally { if (btn) btn.disabled = false; }\r\n}\r\n\r\n/** Ventana modal con formulario. fields: [{id,label,type,options,value,placeholder}] -> devuelve objeto o null. */\r\nfunction modal({ title, text = \"\", fields = [], ok = \"Confirmar\", danger = false }) {\r\n  return new Promise((resolve) => {\r\n    const root = document.getElementById(\"modalRoot\");\r\n    root.innerHTML = `<div class=\"modal-bg\"><form class=\"modal\" role=\"dialog\" aria-modal=\"true\"><h3>${esc(title)}</h3>${text ? `<div class=\"muted\" style=\"line-height:1.5\">${text}</div>` : \"\"}\r\n      ${fields.map((f) => `<label class=\"f\"><span>${esc(f.label)}</span>${f.type === \"select\" ? `<select class=\"input\" id=\"m_${f.id}\">${f.options.map(([v, l]) => `<option value=\"${esc(v)}\" ${v === f.value ? \"selected\" : \"\"}>${esc(l)}</option>`).join(\"\")}</select>` : f.type === \"textarea\" ? `<textarea class=\"input\" id=\"m_${f.id}\" placeholder=\"${esc(f.placeholder ?? \"\")}\">${esc(f.value ?? \"\")}</textarea>` : f.type === \"checkbox\" ? `<span class=\"row\"><input type=\"checkbox\" id=\"m_${f.id}\" ${f.value ? \"checked\" : \"\"}> ${esc(f.hint ?? \"\")}</span>` : `<input class=\"input\" id=\"m_${f.id}\" type=\"${f.type ?? \"text\"}\" value=\"${esc(f.value ?? \"\")}\" placeholder=\"${esc(f.placeholder ?? \"\")}\">`}</label>`).join(\"\")}\r\n      <div class=\"row\" style=\"justify-content:flex-end\"><button class=\"btn\" type=\"button\" data-x>Cancelar</button><button class=\"btn ${danger ? \"bad\" : \"primary\"}\" type=\"submit\">${esc(ok)}</button></div></form></div>`;\r\n    const form = root.querySelector(\"form\");\r\n    const close = (v) => { root.innerHTML = \"\"; resolve(v); };\r\n    root.querySelector(\"[data-x]\").onclick = () => close(null);\r\n    root.querySelector(\".modal-bg\").onclick = (e) => { if (e.target.classList.contains(\"modal-bg\")) close(null); };\r\n    form.onsubmit = (e) => { e.preventDefault(); const out = {}; for (const f of fields) { const el = document.getElementById(\"m_\" + f.id); out[f.id] = f.type === \"checkbox\" ? el.checked : el.value; } close(out); };\r\n    (form.querySelector(\"input,select,textarea\") ?? form.querySelector(\"button[type=submit]\")).focus();\r\n  });\r\n}\r\n\r\nfunction barChart(data, { h = 140, fmt = (v) => v, label = \"\" } = {}) {\r\n  const W = 600, pad = { l: 4, r: 4, t: 8, b: 18 }, max = Math.max(1, ...data.map((d) => d.v));\r\n  const bw = (W - pad.l - pad.r) / data.length;\r\n  const bars = data.map((d, i) => { const bh = (d.v / max) * (h - pad.t - pad.b); return `<rect x=\"${pad.l + i * bw + 1}\" y=\"${h - pad.b - bh}\" width=\"${Math.max(1, bw - 2)}\" height=\"${bh}\" rx=\"2\" fill=\"var(--brand)\" opacity=\"${d.v ? .85 : .2}\"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></rect>`; }).join(\"\");\r\n  const ticks = data.map((d, i) => i % 4 === 0 ? `<text x=\"${pad.l + i * bw + bw / 2}\" y=\"${h - 4}\" text-anchor=\"middle\">${esc(d.short)}</text>` : \"\").join(\"\");\r\n  return `<div class=\"chart\"><svg viewBox=\"0 0 ${W} ${h}\" width=\"100%\" height=\"${h}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"${esc(label)}\">${bars}${ticks}</svg></div>`;\r\n}\r\n\r\n// ---------- Sesión ----------\r\nfunction logout() { store.del(\"pa_key\"); A.key = null; document.getElementById(\"app\").hidden = true; document.getElementById(\"login\").hidden = false; }\r\ndocument.getElementById(\"logout\").onclick = logout;\r\ndocument.getElementById(\"loginForm\").onsubmit = async (e) => {\r\n  e.preventDefault();\r\n  A.key = document.getElementById(\"lkKey\").value.trim(); A.user = document.getElementById(\"lkUser\").value.trim(); A.api = document.getElementById(\"lkApi\").value.trim();\r\n  try { await fetch(A.api.replace(/\\/$/, \"\") + \"/admin/overview\", { headers: { \"x-admin-key\": A.key } }).then((r) => { if (!r.ok) throw new Error(r.status === 401 ? \"Clave incorrecta\" : `No se pudo conectar (${r.status})`); }); }\r\n  catch (err) { document.getElementById(\"lkErr\").textContent = err.message.includes(\"fetch\") ? \"No se pudo conectar con la API. Revisa la URL.\" : err.message; return; }\r\n  store.set(\"pa_key\", A.key); store.set(\"pa_user\", A.user); store.set(\"pa_api\", A.api);\r\n  start();\r\n};\r\n\r\nasync function start() {\r\n  document.getElementById(\"login\").hidden = true; document.getElementById(\"app\").hidden = false;\r\n  document.getElementById(\"whoami\").textContent = `Sesión: ${A.user}`;\r\n  document.getElementById(\"apiInfo\").textContent = `API: ${A.api || location.host}`;\r\n  CATS = await fetch(A.api.replace(/\\/$/, \"\") + \"/v1/categories\").then((r) => r.json()).catch(() => []);\r\n  await refreshCounts();\r\n  route();\r\n}\r\nasync function refreshCounts() {\r\n  OV = await api(\"/admin/overview\").catch(() => OV);\r\n  if (!OV) return;\r\n  const set = (id, n) => { const el = document.getElementById(id); el.hidden = !n; el.textContent = n; };\r\n  set(\"cDrafts\", OV.pending_drafts); set(\"cRes\", OV.open_resolutions);\r\n}\r\nsetInterval(() => { if (A.key) refreshCounts(); }, 30000);\r\n\r\nconst VIEWS = { resumen: viewResumen, disenar: viewDisenar, moderacion: viewModeracion, mercados: viewMercados, resoluciones: viewResoluciones, tendencias: viewTendencias, fuentes: viewFuentes, riesgo: viewRiesgo, operadores: viewOperadores };\r\nfunction route() {\r\n  VIEW = (location.hash.slice(1) || \"resumen\"); if (!VIEWS[VIEW]) VIEW = \"resumen\";\r\n  document.querySelectorAll(\"#nav a\").forEach((a) => a.classList.toggle(\"on\", a.dataset.v === VIEW));\r\n  const main = document.getElementById(\"main\");\r\n  main.innerHTML = `<div class=\"muted\">Cargando…</div>`;\r\n  VIEWS[VIEW](main).catch((e) => { main.innerHTML = `<div class=\"empty\">No se pudo cargar: ${esc(e.message)}</div>`; });\r\n}\r\naddEventListener(\"hashchange\", route);\r\n\r\n// ---------- Resumen ----------\r\nasync function viewResumen(el) {\r\n  await refreshCounts();\r\n  const o = OV, cov = await api(\"/admin/categories/coverage\");\r\n  const short = cov.filter((c) => c.open_events + c.pending_drafts < c.minimum);\r\n  const alerts = [\r\n    o.failed_credits && `<div class=\"bad\">${o.failed_credits} crédito(s) al casino fallaron y se están reintentando.</div>`,\r\n    o.sources_failing && `<div class=\"warn\">${o.sources_failing} fuente(s) con error en la última lectura. <a href=\"#fuentes\">Ver fuentes</a></div>`,\r\n    o.awaiting_resolution && `<div class=\"warn\">${o.awaiting_resolution} evento(s) cerrados esperan resolución. <a href=\"#mercados\">Ver mercados</a></div>`,\r\n    short.length && `<div class=\"warn\">${short.length} categoría(s) por debajo del mínimo de ${short[0].minimum} mercados.</div>`,\r\n    !o.aiEnabled && `<div class=\"muted\">La IA está desactivada: configura ANTHROPIC_API_KEY para generar y resolver preguntas automáticamente.</div>`,\r\n  ].filter(Boolean);\r\n  const maxCov = Math.max(...cov.map((c) => Math.max(c.minimum, c.open_events + c.pending_drafts)), 1);\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Resumen</h1><p>Estado de la plataforma en las últimas 24 horas.</p></div><div class=\"row\"><a class=\"btn primary\" href=\"#disenar\">+ Diseñar mercado</a></div></div>\r\n    <div class=\"kpis\">\r\n      <div class=\"kpi\"><span class=\"k\">Volumen 24 h</span><span class=\"v\">${kmoney(o.volume_24h)}</span><span class=\"d\">${o.trades_24h.toLocaleString(\"es-EC\")} apuestas · total ${kmoney(o.volume_total)}</span></div>\r\n      <div class=\"kpi\"><span class=\"k\">Comisiones 24 h</span><span class=\"v\">${money(o.fees_24h)}</span><span class=\"d\">Total ${money(o.fees_total)}</span></div>\r\n      <div class=\"kpi\"><span class=\"k\">Mercados abiertos</span><span class=\"v\">${o.open_events}</span><span class=\"d\">${o.awaiting_resolution} esperando resolución</span></div>\r\n      <div class=\"kpi\"><span class=\"k\">Jugadores en línea</span><span class=\"v\">${o.players_online}</span><span class=\"d\">${o.players_total.toLocaleString(\"es-EC\")} registrados</span></div>\r\n      <a class=\"kpi ${o.pending_drafts ? \"attn\" : \"\"}\" href=\"#moderacion\" style=\"text-decoration:none;color:inherit\"><span class=\"k\">Por moderar</span><span class=\"v\">${o.pending_drafts}</span><span class=\"d\">${o.autoApprove ? \"Autoaprobación de IA activa\" : \"Preguntas de la IA y manuales\"}</span></a>\r\n      <a class=\"kpi ${o.open_resolutions ? \"attn\" : \"\"}\" href=\"#resoluciones\" style=\"text-decoration:none;color:inherit\"><span class=\"k\">Resoluciones abiertas</span><span class=\"v\">${o.open_resolutions}</span><span class=\"d\">Propuestas o disputadas</span></a>\r\n      <div class=\"kpi ${o.failed_credits ? \"alert\" : \"\"}\"><span class=\"k\">Créditos fallidos</span><span class=\"v\">${o.failed_credits}</span><span class=\"d\">${o.pending_webhooks} webhooks pendientes</span></div>\r\n      <a class=\"kpi\" href=\"#riesgo\" style=\"text-decoration:none;color:inherit\"><span class=\"k\">Riesgo de la casa</span><span class=\"v\">${kmoney(o.house_open_cost)}</span><span class=\"d\">Realizado ${money(o.house_realized)}</span></a>\r\n    </div>\r\n    <div class=\"grid2\">\r\n      <div class=\"panel\"><h2>Volumen por hora <small>últimas 24 h</small></h2>${barChart(o.hourly.map((h) => ({ v: Number(h.volume), l: fdate(h.t), short: new Date(h.t).toLocaleTimeString(\"es-EC\", { hour: \"2-digit\" }) })), { fmt: kmoney, label: \"Volumen por hora\" })}\r\n        ${alerts.length ? `<h2 style=\"margin-top:16px\">Alertas</h2><div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px\">${alerts.join(\"\")}</div>` : `<p class=\"ok\" style=\"margin:14px 0 0\">Sin alertas.</p>`}</div>\r\n      <div class=\"panel\"><h2>Cobertura por categoría <span class=\"row\"><small>mínimo ${cov[0]?.minimum ?? 25}</small><button class=\"btn sm\" id=\"refill\" ${o.aiEnabled ? \"\" : \"disabled title='Requiere ANTHROPIC_API_KEY'\"}>Rellenar con IA</button></span></h2>\r\n        ${cov.map((c) => { const tot = c.open_events + c.pending_drafts; return `<div class=\"cov\"><span>${esc(c.name)}</span><span class=\"bar\" title=\"${c.open_events} abiertos + ${c.pending_drafts} pendientes\"><i style=\"width:${(c.open_events / maxCov) * 100}%\"></i><i class=\"p\" style=\"left:${(c.open_events / maxCov) * 100}%;width:${(c.pending_drafts / maxCov) * 100}%\"></i><b style=\"left:${(c.minimum / maxCov) * 100}%\"></b></span><span class=\"n ${tot < c.minimum ? \"warn\" : \"\"}\">${c.open_events}${c.pending_drafts ? `+${c.pending_drafts}` : \"\"}</span></div>`; }).join(\"\")}\r\n        <p class=\"faint\" style=\"font-size:11px;margin:8px 0 0\">Verde: abiertos · Amarillo: borradores pendientes · Línea: mínimo</p></div>\r\n    </div>`;\r\n  el.querySelector(\"#refill\")?.addEventListener(\"click\", (e) => run(e.target, () => api(\"/admin/categories/refill\", { method: \"POST\", body: {} }), (r) => `Relleno lanzado: ${r.reduce((a, x) => a + (x.created?.length ?? 0), 0)} borradores nuevos`).then(() => route()));\r\n}\r\n\r\n// ---------- Diseñador ----------\r\nconst blankDesign = () => ({ title: \"\", description: \"\", category: CATS[0]?.slug ?? \"politica\", kind: \"binary\", yes: 0.5,\r\n  outcomes: [{ label: \"\", probability: 0.34 }, { label: \"\", probability: 0.33 }, { label: \"Otro\", probability: 0.33 }],\r\n  closeTime: new Date(Date.now() + 30 * 864e5).toISOString().slice(0, 16), resolutionCriteria: \"\", resolutionSource: \"\", imageUrl: \"\", tags: \"\", featured: false, draftId: null });\r\n\r\nfunction designFromPayload(p, draftId = null) {\r\n  const multi = p.kind === \"multi\";\r\n  return { ...blankDesign(), title: p.title ?? \"\", description: p.description ?? \"\", category: p.category, kind: p.kind ?? \"binary\",\r\n    yes: multi ? 0.5 : p.outcomes?.[0]?.probability ?? 0.5, outcomes: multi ? p.outcomes.map((o) => ({ label: o.label, probability: o.probability })) : blankDesign().outcomes,\r\n    closeTime: p.closeTime ? new Date(new Date(p.closeTime).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : blankDesign().closeTime,\r\n    resolutionCriteria: p.resolutionCriteria ?? \"\", resolutionSource: p.resolutionSource ?? \"\", imageUrl: p.imageUrl ?? \"\", tags: (p.tags ?? []).join(\", \"), featured: !!p.featured, draftId };\r\n}\r\nfunction designPayload(d) {\r\n  return { title: d.title.trim(), description: d.description.trim(), category: d.category, kind: d.kind,\r\n    outcomes: d.kind === \"binary\" ? [{ label: \"Sí\", probability: Number(d.yes) }] : d.outcomes.filter((o) => o.label.trim()).map((o) => ({ label: o.label.trim(), probability: Number(o.probability) })),\r\n    closeTime: new Date(d.closeTime).toISOString(), resolutionCriteria: d.resolutionCriteria.trim(), resolutionSource: d.resolutionSource.trim(),\r\n    ...(d.imageUrl.trim() ? { imageUrl: d.imageUrl.trim() } : {}), tags: d.tags.split(\",\").map((t) => t.trim()).filter(Boolean), featured: d.featured };\r\n}\r\nfunction designChecks(d) {\r\n  const p = designPayload(d), close = new Date(d.closeTime);\r\n  const sum = p.outcomes.reduce((a, o) => a + o.probability, 0);\r\n  return [\r\n    [/^¿.{6,}\\?$/.test(p.title), \"La pregunta empieza con ¿ y termina con ?\"],\r\n    [p.title.length <= 200, \"Máximo 200 caracteres\"],\r\n    [close > new Date(Date.now() + 3600e3), \"Cierra al menos 1 hora en el futuro\"],\r\n    [p.kind === \"binary\" || (p.outcomes.length >= 2 && p.outcomes.length <= 20), \"Opción múltiple: entre 2 y 20 opciones con nombre\"],\r\n    [p.kind === \"binary\" || Math.abs(sum - 1) <= 0.02, `Las probabilidades suman 100% (ahora ${Math.round(sum * 100)}%)`],\r\n    [p.outcomes.every((o) => o.probability >= 0.01 && o.probability <= 0.99), \"Cada probabilidad entre 1% y 99%\"],\r\n    [p.resolutionCriteria.length >= 10, \"Criterio de resolución claro (mín. 10 caracteres)\"],\r\n    [p.resolutionSource.length >= 3, \"Fuente oficial que decide\"],\r\n  ];\r\n}\r\n\r\nasync function viewDisenar(el) {\r\n  DESIGN ??= blankDesign();\r\n  const d = DESIGN;\r\n  el.innerHTML = `<div class=\"head\"><div><h1>${d.draftId ? `Editar borrador #${d.draftId}` : \"Diseñar mercado\"}</h1><p>Crea una pregunta Sí/No o de opción múltiple. A la derecha ves cómo la verá el jugador.</p></div>\r\n    <div class=\"row\"><button class=\"btn\" id=\"dReset\" type=\"button\">Empezar de cero</button>${OV?.aiEnabled ? `<button class=\"btn\" id=\"dAi\" type=\"button\">Generar con IA…</button>` : \"\"}</div></div>\r\n    <div class=\"designer\">\r\n      <div class=\"panel form\" id=\"dForm\">\r\n        <label class=\"f\"><span>Pregunta</span><input class=\"input\" id=\"d_title\" value=\"${esc(d.title)}\" placeholder=\"¿Quién ganará Miss Universo 2026?\" maxlength=\"200\"></label>\r\n        <label class=\"f\"><span>Contexto para el jugador <em>(opcional)</em></span><textarea class=\"input\" id=\"d_description\" style=\"min-height:60px\" placeholder=\"Una o dos frases que expliquen por qué importa.\">${esc(d.description)}</textarea></label>\r\n        <div class=\"two\">\r\n          <label class=\"f\"><span>Categoría</span><select class=\"input\" id=\"d_category\">${CATS.map((c) => `<option value=\"${c.slug}\" ${c.slug === d.category ? \"selected\" : \"\"}>${esc(c.name)}</option>`).join(\"\")}</select></label>\r\n          <label class=\"f\"><span>Cierre de apuestas <em>(hora local)</em></span><input class=\"input\" id=\"d_closeTime\" type=\"datetime-local\" value=\"${esc(d.closeTime)}\"></label>\r\n        </div>\r\n        <div class=\"f\"><span class=\"muted\" style=\"font-size:12px;font-weight:600\">Tipo de mercado</span>\r\n          <span class=\"seg\" id=\"d_kind\"><button type=\"button\" data-k=\"binary\" class=\"${d.kind === \"binary\" ? \"on\" : \"\"}\">Sí / No</button><button type=\"button\" data-k=\"multi\" class=\"${d.kind === \"multi\" ? \"on\" : \"\"}\">Opción múltiple</button></span></div>\r\n        <div id=\"d_outcomes\"></div>\r\n        <label class=\"f\"><span>Criterio de resolución</span><textarea class=\"input\" id=\"d_resolutionCriteria\" placeholder=\"Se resuelve Sí si…; empate, aplazamiento o cancelación se resuelven…\">${esc(d.resolutionCriteria)}</textarea>\r\n          <button class=\"btn sm\" type=\"button\" id=\"dTpl\" style=\"align-self:flex-start\">Usar plantilla estándar</button></label>\r\n        <div class=\"two\">\r\n          <label class=\"f\"><span>Fuente oficial que decide</span><input class=\"input\" id=\"d_resolutionSource\" value=\"${esc(d.resolutionSource)}\" placeholder=\"Organización Miss Universo\"></label>\r\n          <label class=\"f\"><span>Imagen <em>(URL, opcional)</em></span><input class=\"input\" id=\"d_imageUrl\" value=\"${esc(d.imageUrl)}\" placeholder=\"https://…/imagen.jpg\"></label>\r\n        </div>\r\n        <div class=\"two\">\r\n          <label class=\"f\"><span>Etiquetas <em>(separadas por coma)</em></span><input class=\"input\" id=\"d_tags\" value=\"${esc(d.tags)}\" placeholder=\"miss universo, reinados\"></label>\r\n          <label class=\"f\"><span>Portada</span><span class=\"row\" style=\"height:38px\"><input type=\"checkbox\" id=\"d_featured\" ${d.featured ? \"checked\" : \"\"}> Destacar en la portada del módulo</span></label>\r\n        </div>\r\n      </div>\r\n      <div class=\"preview\">\r\n        <div class=\"panel\"><h2>Vista previa <small>tarjeta del jugador</small></h2><div id=\"dPreview\"></div></div>\r\n        <div class=\"panel\"><h2>Revisión</h2><div class=\"checks\" id=\"dChecks\"></div>\r\n          <div class=\"row\" style=\"margin-top:14px\">${d.draftId ? `<button class=\"btn primary\" id=\"dApprove\" type=\"button\">Aprobar y publicar</button>` : `<button class=\"btn primary\" id=\"dPublish\" type=\"button\">Publicar mercado</button><button class=\"btn\" id=\"dDraft\" type=\"button\">Guardar como borrador</button>`}</div>\r\n          <p class=\"faint\" style=\"font-size:12px;margin:10px 0 0\">Al publicar, el market maker de la casa empieza a cotizar con las probabilidades iniciales.</p></div>\r\n      </div>\r\n    </div>`;\r\n  const read = () => {\r\n    for (const k of [\"title\", \"description\", \"category\", \"closeTime\", \"resolutionCriteria\", \"resolutionSource\", \"imageUrl\", \"tags\"]) d[k] = document.getElementById(\"d_\" + k).value;\r\n    d.featured = document.getElementById(\"d_featured\").checked;\r\n  };\r\n  const renderOutcomes = () => {\r\n    const box = document.getElementById(\"d_outcomes\");\r\n    if (d.kind === \"binary\") {\r\n      box.innerHTML = `<label class=\"f\"><span>Probabilidad inicial del Sí: <b class=\"num\" id=\"d_yesv\">${Math.round(d.yes * 100)}%</b> <em>(precio de apertura ${Math.round(d.yes * 100)}¢ / No ${100 - Math.round(d.yes * 100)}¢)</em></span><input type=\"range\" min=\"1\" max=\"99\" value=\"${Math.round(d.yes * 100)}\" id=\"d_yes\" style=\"accent-color:var(--brand)\"></label>`;\r\n      box.querySelector(\"#d_yes\").oninput = (e) => { d.yes = e.target.value / 100; box.querySelector(\"#d_yesv\").textContent = e.target.value + \"%\"; refresh(); };\r\n    } else {\r\n      const sum = d.outcomes.reduce((a, o) => a + Number(o.probability || 0), 0);\r\n      box.innerHTML = `<div class=\"f\"><span class=\"muted\" style=\"font-size:12px;font-weight:600\">Opciones y probabilidad inicial</span>\r\n        ${d.outcomes.map((o, i) => `<div class=\"outrow\"><input class=\"input\" data-ol=\"${i}\" value=\"${esc(o.label)}\" placeholder=\"Opción ${i + 1}\"><span class=\"row\" style=\"flex-wrap:nowrap\"><input class=\"input num\" data-op=\"${i}\" type=\"number\" min=\"1\" max=\"99\" step=\"1\" value=\"${Math.round(o.probability * 100)}\" style=\"text-align:right\"><span class=\"muted\">%</span></span><button type=\"button\" class=\"btn sm\" data-od=\"${i}\" aria-label=\"Quitar opción\" ${d.outcomes.length <= 2 ? \"disabled\" : \"\"}>✕</button></div>`).join(\"\")}\r\n        <div class=\"row\" style=\"justify-content:space-between\"><span class=\"row\"><button type=\"button\" class=\"btn sm\" id=\"d_add\">+ Agregar opción</button><button type=\"button\" class=\"btn sm\" id=\"d_norm\">Normalizar a 100%</button></span><span class=\"sum ${Math.abs(sum - 1) > 0.02 ? \"warn\" : \"ok\"}\">Suma: ${Math.round(sum * 100)}%</span></div></div>`;\r\n      box.querySelectorAll(\"[data-ol]\").forEach((inp) => (inp.oninput = () => { d.outcomes[inp.dataset.ol].label = inp.value; refresh(); }));\r\n      box.querySelectorAll(\"[data-op]\").forEach((inp) => (inp.oninput = () => { d.outcomes[inp.dataset.op].probability = Number(inp.value) / 100; refresh(true); }));\r\n      box.querySelectorAll(\"[data-od]\").forEach((b) => (b.onclick = () => { d.outcomes.splice(Number(b.dataset.od), 1); renderOutcomes(); refresh(); }));\r\n      box.querySelector(\"#d_add\").onclick = () => { d.outcomes.push({ label: \"\", probability: 0.05 }); renderOutcomes(); refresh(); };\r\n      box.querySelector(\"#d_norm\").onclick = () => {\r\n        const s = d.outcomes.reduce((a, o) => a + Number(o.probability || 0), 0) || 1;\r\n        const pct = d.outcomes.map((o) => Math.max(1, Math.round((Number(o.probability || 0) / s) * 100)));\r\n        // El redondeo puede dejar 99% o 101%: el ajuste va a la opción más probable\r\n        pct[pct.indexOf(Math.max(...pct))] += 100 - pct.reduce((a, b) => a + b, 0);\r\n        d.outcomes.forEach((o, i) => (o.probability = pct[i] / 100));\r\n        renderOutcomes(); refresh();\r\n      };\r\n    }\r\n  };\r\n  const refresh = (sumOnly) => {\r\n    read();\r\n    if (sumOnly && d.kind === \"multi\") { const s = d.outcomes.reduce((a, o) => a + Number(o.probability || 0), 0); const el2 = document.querySelector(\"#d_outcomes .sum\"); el2.textContent = `Suma: ${Math.round(s * 100)}%`; el2.className = \"sum \" + (Math.abs(s - 1) > 0.02 ? \"warn\" : \"ok\"); }\r\n    const p = designPayload(d);\r\n    const yes = Math.round((p.outcomes[0]?.probability ?? 0.5) * 100);\r\n    document.getElementById(\"dPreview\").innerHTML = `<div class=\"pcard\"><div class=\"pic\">${p.imageUrl ? `<img src=\"${esc(p.imageUrl)}\" alt=\"\">` : \"\"}<span class=\"badge\">${esc(catName(p.category))}</span></div><div class=\"body\">\r\n      <div class=\"q\">${esc(p.title || \"Escribe la pregunta…\")}</div>\r\n      ${p.kind === \"binary\" ? `<div class=\"big\">${yes}% <span class=\"muted\" style=\"font-size:12px;font-family:var(--sans)\">Sí</span></div><div class=\"yn\"><span class=\"y\">Sí ${yes}¢</span><span class=\"n\">No ${100 - yes}¢</span></div>`\r\n        : [...p.outcomes].sort((a, b) => b.probability - a.probability).slice(0, 4).map((o) => `<div class=\"mo\"><i style=\"width:${o.probability * 100}%\"></i><span>${esc(o.label)}</span><b class=\"num\">${Math.round(o.probability * 100)}%</b></div>`).join(\"\") || `<span class=\"faint\">Agrega opciones…</span>`}\r\n      <div class=\"faint\" style=\"font-size:11px\">Cierra ${fdate(d.closeTime)}</div></div></div>\r\n      <div class=\"rules\" style=\"margin-top:10px\"><b>Cómo se resuelve:</b> ${esc(p.resolutionCriteria || \"—\")}<br><b>Fuente:</b> ${esc(p.resolutionSource || \"—\")}</div>`;\r\n    const checks = designChecks(d);\r\n    document.getElementById(\"dChecks\").innerHTML = checks.map(([ok, t]) => `<div class=\"${ok ? \"y\" : \"n\"}\">${esc(t)}</div>`).join(\"\");\r\n    const allOk = checks.every(([ok]) => ok);\r\n    [\"dPublish\", \"dDraft\", \"dApprove\"].forEach((id) => { const b = document.getElementById(id); if (b) b.disabled = !allOk && id !== \"dDraft\"; });\r\n  };\r\n  el.querySelector(\"#dForm\").addEventListener(\"input\", () => refresh());\r\n  el.querySelectorAll(\"#d_kind button\").forEach((b) => (b.onclick = () => { d.kind = b.dataset.k; el.querySelectorAll(\"#d_kind button\").forEach((x) => x.classList.toggle(\"on\", x === b)); renderOutcomes(); refresh(); }));\r\n  el.querySelector(\"#dTpl\").onclick = () => {\r\n    read();\r\n    const src = d.resolutionSource || \"la fuente oficial\";\r\n    document.getElementById(\"d_resolutionCriteria\").value = d.kind === \"binary\"\r\n      ? `Se resuelve \"Sí\" si ${src} confirma lo que plantea la pregunta antes del cierre (${fdate(d.closeTime)}). En cualquier otro caso se resuelve \"No\". Si el evento se cancela o se aplaza más allá de 60 días, el mercado se anula y se devuelve $0,50 por acción.`\r\n      : `Gana la opción que coincida con el resultado oficial publicado por ${src}. Si el resultado no corresponde a ninguna opción con nombre, gana \"Otro\" (si existe). Si el evento se cancela o no se define dentro de los 60 días posteriores al cierre, el mercado se anula y se devuelve $0,50 por acción.`;\r\n    refresh();\r\n  };\r\n  el.querySelector(\"#dReset\").onclick = () => { DESIGN = blankDesign(); route(); };\r\n  el.querySelector(\"#dAi\")?.addEventListener(\"click\", async (e) => {\r\n    const r = await modal({ title: \"Generar preguntas con IA\", text: \"La IA investiga en la web la categoría y deja las propuestas en Moderación.\", ok: \"Generar\",\r\n      fields: [{ id: \"category\", label: \"Categoría\", type: \"select\", options: CATS.map((c) => [c.slug, c.name]), value: d.category }, { id: \"count\", label: \"Cantidad\", type: \"number\", value: 5 }] });\r\n    if (r) run(e.target, () => api(\"/admin/drafts/generate\", { method: \"POST\", body: { category: r.category, count: Number(r.count) } }), (x) => `${x.created?.length ?? 0} borradores creados. Revísalos en Moderación.`).then(refreshCounts);\r\n  });\r\n  el.querySelector(\"#dPublish\")?.addEventListener(\"click\", (e) => run(e.target, () => api(\"/admin/events\", { method: \"POST\", body: designPayload(d) }), (ev) => `Publicado: ${ev.title}`).then((ev) => { if (ev) { DESIGN = null; location.hash = \"#mercados\"; } }));\r\n  el.querySelector(\"#dDraft\")?.addEventListener(\"click\", (e) => run(e.target, () => api(\"/admin/drafts\", { method: \"POST\", body: designPayload(d) }), \"Guardado en Moderación\").then((r) => { if (r) { DESIGN = null; refreshCounts(); location.hash = \"#moderacion\"; } }));\r\n  el.querySelector(\"#dApprove\")?.addEventListener(\"click\", (e) => run(e.target, () => api(`/admin/drafts/${d.draftId}/approve`, { method: \"POST\", body: { edits: designPayload(d) } }), (ev) => `Publicado: ${ev.title}`).then((ev) => { if (ev) { DESIGN = null; refreshCounts(); location.hash = \"#moderacion\"; } }));\r\n  renderOutcomes(); refresh();\r\n}\r\n\r\n// ---------- Moderación ----------\r\nasync function viewModeracion(el) {\r\n  const status = viewModeracion.status ?? \"pending\";\r\n  const drafts = await api(`/admin/drafts?status=${status}`);\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Moderación</h1><p>Preguntas propuestas por la IA (a partir de tendencias o del relleno por categoría) y borradores manuales. Nada se publica sin aprobación${OV?.autoApprove ? \", salvo que la autoaprobación de IA esté activa\" : \"\"}.</p></div>\r\n    <div class=\"row\"><span class=\"seg\" id=\"mStatus\">${[[\"pending\", \"Pendientes\"], [\"approved\", \"Aprobados\"], [\"rejected\", \"Rechazados\"]].map(([k, l]) => `<button type=\"button\" data-s=\"${k}\" class=\"${k === status ? \"on\" : \"\"}\">${l}</button>`).join(\"\")}</span>\r\n    ${status === \"pending\" ? `<button class=\"btn ok\" id=\"mBulk\" type=\"button\" disabled>Aprobar seleccionados</button>` : \"\"}</div></div>\r\n    <div class=\"cards\">${drafts.length ? drafts.map((dr) => { const p = dr.payload; return `<div class=\"dcard\">\r\n      ${status === \"pending\" ? `<input type=\"checkbox\" data-sel=\"${dr.id}\" aria-label=\"Seleccionar\">` : `<span></span>`}\r\n      <div><h3>${esc(p.title)}</h3>\r\n        <div class=\"meta\"><span>${esc(catName(p.category))}</span><span>${p.kind === \"multi\" ? \"Opción múltiple\" : \"Sí / No\"}</span><span>Cierra ${fday(p.closeTime)}</span><span>${esc(dr.created_by)}</span><span>${ago(dr.created_at)}</span>${dr.trend_label ? `<span>Tendencia: ${esc(dr.trend_label)}</span>` : \"\"}</div>\r\n        <div class=\"opts\">${(p.kind === \"multi\" ? p.outcomes : [{ label: \"Sí\", probability: p.outcomes?.[0]?.probability }]).map((o) => `<span class=\"opt\">${esc(o.label)} <b>${Math.round((o.probability ?? 0) * 100)}%</b></span>`).join(\"\")}</div>\r\n        <details><summary>Criterio, fuente y razonamiento</summary><p><b>Resolución:</b> ${esc(p.resolutionCriteria)}</p><p><b>Fuente:</b> ${esc(p.resolutionSource)}</p>${p.rationale ? `<p><b>Por qué:</b> ${esc(p.rationale)}</p>` : \"\"}${(p.sourceUrls ?? []).length ? `<p>${p.sourceUrls.map((u) => `<a href=\"${esc(u)}\" target=\"_blank\" rel=\"noopener\">${esc(u)}</a>`).join(\"<br>\")}</p>` : \"\"}${dr.review_note ? `<p><b>Nota de revisión:</b> ${esc(dr.review_note)}</p>` : \"\"}</details></div>\r\n      <div class=\"acts\">${status === \"pending\" ? `<button class=\"btn ok sm\" data-ap=\"${dr.id}\">Aprobar</button><button class=\"btn sm\" data-ed=\"${dr.id}\">Editar</button><button class=\"btn bad sm\" data-rj=\"${dr.id}\">Rechazar</button>` : dr.event_id ? `<span class=\"faint\" style=\"font-size:12px\">Evento #${dr.event_id}</span>` : \"\"}</div></div>`; }).join(\"\") : `<div class=\"empty\">No hay borradores ${status === \"pending\" ? \"pendientes\" : STATUS[status]?.toLowerCase() + \"s\"}.</div>`}</div>`;\r\n  el.querySelectorAll(\"#mStatus button\").forEach((b) => (b.onclick = () => { viewModeracion.status = b.dataset.s; route(); }));\r\n  const sel = () => [...el.querySelectorAll(\"[data-sel]:checked\")].map((c) => c.dataset.sel);\r\n  el.querySelectorAll(\"[data-sel]\").forEach((c) => (c.onchange = () => { document.getElementById(\"mBulk\").disabled = !sel().length; }));\r\n  el.querySelector(\"#mBulk\")?.addEventListener(\"click\", async (e) => {\r\n    const ids = sel(); let ok = 0;\r\n    await run(e.target, async () => { for (const id of ids) { await api(`/admin/drafts/${id}/approve`, { method: \"POST\", body: { edits: {} } }).then(() => ok++).catch((err) => toast(`#${id}: ${err.message}`, true)); } });\r\n    toast(`${ok} de ${ids.length} publicados`); await refreshCounts(); route();\r\n  });\r\n  el.querySelectorAll(\"[data-ap]\").forEach((b) => (b.onclick = () => run(b, () => api(`/admin/drafts/${b.dataset.ap}/approve`, { method: \"POST\", body: { edits: {} } }), (ev) => `Publicado: ${ev.title}`).then(async (r) => { if (r) { await refreshCounts(); route(); } })));\r\n  el.querySelectorAll(\"[data-ed]\").forEach((b) => (b.onclick = () => { const dr = drafts.find((x) => String(x.id) === b.dataset.ed); DESIGN = designFromPayload(dr.payload, dr.id); location.hash = \"#disenar\"; }));\r\n  el.querySelectorAll(\"[data-rj]\").forEach((b) => (b.onclick = async () => {\r\n    const r = await modal({ title: \"Rechazar borrador\", fields: [{ id: \"note\", label: \"Motivo (queda registrado)\", type: \"textarea\", placeholder: \"Ambigua, duplicada, tema no permitido…\" }], ok: \"Rechazar\", danger: true });\r\n    if (r) run(b, () => api(`/admin/drafts/${b.dataset.rj}/reject`, { method: \"POST\", body: { note: r.note } }), \"Borrador rechazado\").then(async () => { await refreshCounts(); route(); });\r\n  }));\r\n}\r\n\r\n// ---------- Mercados ----------\r\nconst MK = { status: \"open\", category: \"\", q: \"\", sort: \"new\", offset: 0 };\r\nasync function viewMercados(el) {\r\n  const params = new URLSearchParams({ status: MK.status, sort: MK.sort, limit: \"50\", offset: String(MK.offset) });\r\n  if (MK.category) params.set(\"category\", MK.category);\r\n  if (MK.q) params.set(\"q\", MK.q);\r\n  const events = await api(`/admin/events?${params}`);\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Mercados</h1><p>Todos los eventos publicados. Desde aquí se destacan, cierran, resuelven o duplican.</p></div><a class=\"btn primary\" href=\"#disenar\">+ Diseñar mercado</a></div>\r\n    <div class=\"row\" style=\"margin-bottom:12px\">\r\n      <select class=\"input\" id=\"fStatus\" style=\"width:auto\">${[[\"open\", \"Abiertos\"], [\"closed,resolving\", \"Por resolver\"], [\"resolved,void\", \"Resueltos y anulados\"], [\"open,closed,resolving,resolved,void\", \"Todos\"]].map(([v, l]) => `<option value=\"${v}\" ${v === MK.status ? \"selected\" : \"\"}>${l}</option>`).join(\"\")}</select>\r\n      <select class=\"input\" id=\"fCat\" style=\"width:auto\"><option value=\"\">Todas las categorías</option>${CATS.map((c) => `<option value=\"${c.slug}\" ${c.slug === MK.category ? \"selected\" : \"\"}>${esc(c.name)}</option>`).join(\"\")}</select>\r\n      <select class=\"input\" id=\"fSort\" style=\"width:auto\">${[[\"new\", \"Más nuevos\"], [\"volume\", \"Más volumen\"], [\"volume24h\", \"Volumen 24 h\"], [\"closing\", \"Cierran pronto\"]].map(([v, l]) => `<option value=\"${v}\" ${v === MK.sort ? \"selected\" : \"\"}>${l}</option>`).join(\"\")}</select>\r\n      <input class=\"input\" id=\"fQ\" type=\"search\" placeholder=\"Buscar…\" value=\"${esc(MK.q)}\" style=\"width:min(260px,100%)\">\r\n    </div>\r\n    <div class=\"tablewrap\"><table><thead><tr><th>Mercado</th><th>Categoría</th><th>Precios</th><th class=\"num\">Volumen</th><th class=\"num\">Jugadores</th><th>Cierre</th><th>Estado</th><th></th></tr></thead><tbody>\r\n    ${events.length ? events.map((e) => `<tr><td><div class=\"t\">${e.featured ? \"★ \" : \"\"}${esc(e.title)}</div><span class=\"faint\" style=\"font-size:11px\">#${e.id} · ${e.kind === \"multi\" ? `${e.markets.length} opciones` : \"Sí / No\"}</span></td>\r\n      <td>${esc(catName(e.category))}</td>\r\n      <td><div class=\"opts\">${(e.kind === \"multi\" ? [...e.markets].sort((a, b) => b.price - a.price).slice(0, 3) : e.markets).map((m) => `<span class=\"opt\">${esc(e.kind === \"multi\" ? m.label : \"Sí\")} <b>${m.price}%</b>${m.resolvedOutcome ? ` → ${m.resolvedOutcome}` : \"\"}</span>`).join(\"\")}</div></td>\r\n      <td class=\"num\">${kmoney(e.volume)}</td><td class=\"num\">${e.traders}</td><td style=\"white-space:nowrap\">${fday(e.closeTime)}</td><td>${pill(e.status)}</td>\r\n      <td><div class=\"row\" style=\"flex-wrap:nowrap\">\r\n        ${[\"open\", \"closed\", \"resolving\"].includes(e.status) ? `<button class=\"btn sm\" data-res=\"${e.id}\">Resolver</button>` : \"\"}\r\n        ${e.status === \"open\" ? `<button class=\"btn sm\" data-feat=\"${e.id}\" data-v=\"${e.featured ? 0 : 1}\">${e.featured ? \"Quitar ★\" : \"Destacar\"}</button><button class=\"btn sm\" data-close=\"${e.id}\">Cerrar</button>` : \"\"}\r\n        <button class=\"btn sm\" data-dup=\"${e.id}\">Duplicar</button></div></td></tr>`).join(\"\") : `<tr><td colspan=\"8\" class=\"muted\" style=\"text-align:center;padding:24px\">No hay mercados con estos filtros.</td></tr>`}\r\n    </tbody></table></div>\r\n    <div class=\"row\" style=\"justify-content:space-between;margin-top:10px\"><button class=\"btn sm\" id=\"pPrev\" ${MK.offset ? \"\" : \"disabled\"}>← Anteriores</button><span class=\"faint\">Mostrando ${MK.offset + 1}–${MK.offset + events.length}</span><button class=\"btn sm\" id=\"pNext\" ${events.length === 50 ? \"\" : \"disabled\"}>Siguientes →</button></div>`;\r\n  const reload = () => { MK.offset = 0; route(); };\r\n  el.querySelector(\"#fStatus\").onchange = (e) => { MK.status = e.target.value; reload(); };\r\n  el.querySelector(\"#fCat\").onchange = (e) => { MK.category = e.target.value; reload(); };\r\n  el.querySelector(\"#fSort\").onchange = (e) => { MK.sort = e.target.value; reload(); };\r\n  el.querySelector(\"#fQ\").oninput = (e) => { clearTimeout(viewMercados.t); viewMercados.t = setTimeout(() => { MK.q = e.target.value.trim(); reload(); }, 350); };\r\n  el.querySelector(\"#pPrev\").onclick = () => { MK.offset = Math.max(0, MK.offset - 50); route(); };\r\n  el.querySelector(\"#pNext\").onclick = () => { MK.offset += 50; route(); };\r\n  const ev = (id) => events.find((x) => String(x.id) === String(id));\r\n  el.querySelectorAll(\"[data-feat]\").forEach((b) => (b.onclick = () => run(b, () => api(`/admin/events/${b.dataset.feat}`, { method: \"PATCH\", body: { featured: b.dataset.v === \"1\" } }), \"Actualizado\").then(() => route())));\r\n  el.querySelectorAll(\"[data-close]\").forEach((b) => (b.onclick = async () => {\r\n    const r = await modal({ title: \"Cerrar mercado\", text: `Se detienen las apuestas de <b>${esc(ev(b.dataset.close).title)}</b> y se devuelven las órdenes pendientes. Después hay que resolverlo.`, ok: \"Cerrar ahora\", danger: true });\r\n    if (r) run(b, () => api(`/admin/events/${b.dataset.close}/close`, { method: \"POST\", body: {} }), \"Mercado cerrado\").then(() => route());\r\n  }));\r\n  el.querySelectorAll(\"[data-dup]\").forEach((b) => (b.onclick = () => { const e = ev(b.dataset.dup);\r\n    DESIGN = designFromPayload({ title: e.title, description: e.description, category: e.category, kind: e.kind, outcomes: e.kind === \"multi\" ? e.markets.map((m) => ({ label: m.label, probability: m.price / 100 })) : [{ label: \"Sí\", probability: e.markets[0].price / 100 }], resolutionCriteria: e.resolutionCriteria, resolutionSource: e.resolutionSource, imageUrl: e.imageUrl ?? \"\", tags: e.tags });\r\n    location.hash = \"#disenar\"; }));\r\n  el.querySelectorAll(\"[data-res]\").forEach((b) => (b.onclick = () => resolveDialog(ev(b.dataset.res), b)));\r\n}\r\nasync function resolveDialog(e, btn) {\r\n  const options = e.kind === \"multi\" ? [...e.markets.map((m) => [String(m.id), `Gana: ${m.label}`]), [\"VOID\", \"Anular (paga $0,50 por acción)\"]] : [[\"YES\", \"Sí\"], [\"NO\", \"No\"], [\"VOID\", \"Anular (paga $0,50 por acción)\"]];\r\n  const fields = [{ id: \"result\", label: \"Resultado\", type: \"select\", options }, { id: \"explanation\", label: \"Explicación (la verán los jugadores)\", type: \"textarea\" }, { id: \"url\", label: \"Evidencia (URL de la fuente oficial)\", type: \"url\", placeholder: \"https://\" }];\r\n  const r = await modal({ title: \"Proponer resolución\", text: `<b>${esc(e.title)}</b><br>Fuente: ${esc(e.resolutionSource)}<br>Se detiene el trading y corre la ventana de disputa antes de pagar.${OV?.aiEnabled ? \"\" : \"\"}`, fields, ok: \"Proponer\" });\r\n  if (!r) return;\r\n  const body = { explanation: r.explanation, evidence: r.url ? [{ url: r.url }] : [] };\r\n  if (r.result === \"VOID\" || r.result === \"YES\" || r.result === \"NO\") body.outcome = r.result; else body.winningMarketId = Number(r.result);\r\n  run(btn, () => api(`/admin/events/${e.id}/resolve`, { method: \"POST\", body }), \"Propuesta creada. Corre la ventana de disputa.\").then(async (x) => { if (x) { await refreshCounts(); route(); } });\r\n}\r\n\r\n// ---------- Resoluciones ----------\r\nasync function viewResoluciones(el) {\r\n  const status = viewResoluciones.status ?? \"proposed,disputed\";\r\n  const list = await api(`/admin/resolutions?status=${status}`);\r\n  const closed = OV?.aiEnabled ? await api(\"/admin/events?status=closed&sort=closing&limit=20\") : [];\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Resoluciones</h1><p>Como el oráculo optimista de Polymarket: alguien propone el resultado, corre la ventana de disputa y, si nadie disputa, se paga $1 por acción ganadora.</p></div>\r\n    <span class=\"seg\" id=\"rStatus\">${[[\"proposed,disputed\", \"Abiertas\"], [\"finalized\", \"Finalizadas\"], [\"rejected\", \"Rechazadas\"]].map(([k, l]) => `<button type=\"button\" data-s=\"${k}\" class=\"${k === status ? \"on\" : \"\"}\">${l}</button>`).join(\"\")}</span></div>\r\n    <div class=\"cards\">${list.length ? list.map((r) => `<div class=\"dcard\"><span></span><div><h3>${esc(r.title)}</h3>\r\n      <div class=\"meta\">${pill(r.status)}<span>Resultado: <b>${r.outcome === \"VOID\" ? \"Anulado\" : r.winning_market_id ? `mercado #${r.winning_market_id}` : r.outcome === \"YES\" ? \"Sí\" : \"No\"}</b></span><span>Propuso: ${esc(r.proposer)}</span><span>${ago(r.created_at)}</span>${r.status === \"proposed\" ? `<span>Ventana: ${until(r.challenge_ends_at)}</span>` : \"\"}</div>\r\n      ${r.explanation ? `<div class=\"muted\" style=\"font-size:13px\">${esc(r.explanation)}</div>` : \"\"}\r\n      ${(r.evidence ?? []).length ? `<details><summary>Evidencia</summary><p>${r.evidence.map((x) => `<a href=\"${esc(x.url)}\" target=\"_blank\" rel=\"noopener\">${esc(x.title || x.url)}</a>${x.quote ? ` — “${esc(x.quote)}”` : \"\"}`).join(\"<br>\")}</p></details>` : \"\"}\r\n      ${r.dispute_reason ? `<div class=\"bad\" style=\"font-size:13px;margin-top:6px\">Disputa (${esc(r.disputed_by)}): ${esc(r.dispute_reason)}</div>` : \"\"}</div>\r\n      <div class=\"acts\">${r.status === \"proposed\" ? `<button class=\"btn sm\" data-dis=\"${r.id}\">Disputar</button><button class=\"btn ok sm\" data-fin=\"${r.id}\" data-force=\"${new Date(r.challenge_ends_at) > new Date() ? 1 : 0}\">Finalizar${new Date(r.challenge_ends_at) > new Date() ? \" ya\" : \"\"}</button>` : \"\"}\r\n        ${r.status === \"disputed\" ? `<button class=\"btn ok sm\" data-fin=\"${r.id}\" data-force=\"1\">Confirmar y pagar</button><button class=\"btn bad sm\" data-rej=\"${r.id}\">Rechazar propuesta</button>` : \"\"}</div></div>`).join(\"\") : `<div class=\"empty\">No hay resoluciones en este estado.</div>`}</div>\r\n    ${closed.length && status !== \"finalized\" ? `<h2 style=\"font-size:16px;margin:24px 0 10px\">Cerrados sin propuesta <span class=\"faint\" style=\"font-size:12px;font-weight:500\">la IA puede investigar el resultado</span></h2>\r\n      <div class=\"tablewrap\"><table><tbody>${closed.filter((e) => !e.resolution).map((e) => `<tr><td><div class=\"t\">${esc(e.title)}</div><span class=\"faint\" style=\"font-size:11px\">Cerró ${fday(e.closeTime)} · ${esc(e.resolutionSource)}</span></td><td style=\"width:1%\"><button class=\"btn sm\" data-ai=\"${e.id}\">Resolver con IA</button></td></tr>`).join(\"\")}</tbody></table></div>` : \"\"}`;\r\n  el.querySelectorAll(\"#rStatus button\").forEach((b) => (b.onclick = () => { viewResoluciones.status = b.dataset.s; route(); }));\r\n  el.querySelectorAll(\"[data-dis]\").forEach((b) => (b.onclick = async () => { const r = await modal({ title: \"Disputar propuesta\", fields: [{ id: \"reason\", label: \"Motivo\", type: \"textarea\" }], ok: \"Disputar\", danger: true }); if (r) run(b, () => api(`/admin/resolutions/${b.dataset.dis}/dispute`, { method: \"POST\", body: { reason: r.reason } }), \"Propuesta disputada\").then(() => route()); }));\r\n  el.querySelectorAll(\"[data-rej]\").forEach((b) => (b.onclick = () => run(b, () => api(`/admin/resolutions/${b.dataset.rej}/reject`, { method: \"POST\", body: {} }), \"Propuesta rechazada. Puedes proponer otro resultado desde Mercados.\").then(() => route())));\r\n  el.querySelectorAll(\"[data-fin]\").forEach((b) => (b.onclick = async () => {\r\n    if (b.dataset.force === \"1\") { const r = await modal({ title: \"Finalizar y pagar\", text: \"Se pagará a los ganadores en sus casinos. Esta acción no se puede deshacer.\", ok: \"Finalizar\" }); if (!r) return; }\r\n    run(b, () => api(`/admin/resolutions/${b.dataset.fin}/finalize`, { method: \"POST\", body: { force: b.dataset.force === \"1\" } }), (x) => `Finalizada. ${x.payouts ?? 0} pagos enviados.`).then(async () => { await refreshCounts(); route(); });\r\n  }));\r\n  el.querySelectorAll(\"[data-ai]\").forEach((b) => (b.onclick = () => run(b, () => api(`/admin/events/${b.dataset.ai}/ai-resolve`, { method: \"POST\", body: {} }), (x) => x.proposed ? `La IA propuso: ${x.decision} (${Math.round(x.confidence * 100)}%)` : `Sin propuesta: ${x.explanation ?? x.decision}`).then(() => route())));\r\n}\r\n\r\n// ---------- Tendencias y señales ----------\r\nasync function viewTendencias(el) {\r\n  const trends = await api(\"/admin/trends?status=active,used\");\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Tendencias y señales</h1><p>Temas que se repiten en varias fuentes en las últimas 48 h. Las señales de Instagram, TikTok y otras redes suman puntaje.</p></div>\r\n    <div class=\"row\"><button class=\"btn\" id=\"tDetect\">Recalcular tendencias</button><button class=\"btn primary\" id=\"tSignal\">+ Señal social</button></div></div>\r\n    <div class=\"tablewrap\"><table><thead><tr><th>Tendencia</th><th>Categoría</th><th class=\"num\">Puntaje</th><th class=\"num\">Artículos</th><th class=\"num\">Fuentes</th><th class=\"num\">Redes</th><th>Visto</th><th>Estado</th><th></th></tr></thead><tbody>\r\n    ${trends.length ? trends.map((t) => `<tr><td><div class=\"t\">${esc(t.label)}</div><div class=\"opts\" style=\"margin-top:4px\">${t.keywords.slice(0, 6).map((k) => `<span class=\"opt\">${esc(k)}</span>`).join(\"\")}</div></td><td>${esc(catName(t.category))}</td><td class=\"num\">${Number(t.score).toFixed(1)}</td><td class=\"num\">${t.article_count}</td><td class=\"num\">${t.source_count}</td><td class=\"num\">${t.social_count}</td><td style=\"white-space:nowrap\">${ago(t.last_seen)}</td><td>${t.status === \"used\" ? `<span class=\"pill resolved\">Usada</span>` : `<span class=\"pill open\">Activa</span>`}</td>\r\n      <td><div class=\"row\" style=\"flex-wrap:nowrap\">${OV?.aiEnabled ? `<button class=\"btn sm\" data-gen=\"${t.id}\">Generar preguntas</button>` : \"\"}<button class=\"btn sm\" data-ign=\"${t.id}\">Ignorar</button></div></td></tr>`).join(\"\") : `<tr><td colspan=\"9\" class=\"muted\" style=\"text-align:center;padding:24px\">Aún no hay tendencias. Ejecuta la ingesta desde Fuentes.</td></tr>`}\r\n    </tbody></table></div>`;\r\n  el.querySelector(\"#tDetect\").onclick = (e) => run(e.target, () => api(\"/admin/trends/detect\", { method: \"POST\", body: {} }), (r) => `${r.trends} tendencias detectadas`).then(() => route());\r\n  el.querySelector(\"#tSignal\").onclick = async () => {\r\n    const r = await modal({ title: \"Agregar señal social\", text: \"Lo que el equipo (o el agente de navegador) vio en Instagram, TikTok, X o YouTube.\", ok: \"Guardar\",\r\n      fields: [{ id: \"platform\", label: \"Plataforma\", type: \"select\", options: [[\"instagram\", \"Instagram\"], [\"tiktok\", \"TikTok\"], [\"x\", \"X\"], [\"youtube\", \"YouTube\"], [\"otra\", \"Otra\"]] }, { id: \"text\", label: \"Qué se está viralizando\", type: \"textarea\" }, { id: \"url\", label: \"Enlace\", type: \"url\", placeholder: \"https://\" }, { id: \"views\", label: \"Vistas o interacciones (aprox.)\", type: \"number\" }] });\r\n    if (r) run(null, () => api(\"/admin/social-signals\", { method: \"POST\", body: { platform: r.platform, text: r.text, ...(r.url ? { url: r.url } : {}), metrics: r.views ? { views: Number(r.views) } : {}, capturedBy: A.user } }), \"Señal guardada\");\r\n  };\r\n  el.querySelectorAll(\"[data-gen]\").forEach((b) => (b.onclick = () => run(b, () => api(\"/admin/drafts/generate\", { method: \"POST\", body: { trendId: Number(b.dataset.gen) } }), (x) => `${x.created?.length ?? 0} borradores en Moderación`).then(async () => { await refreshCounts(); route(); })));\r\n  el.querySelectorAll(\"[data-ign]\").forEach((b) => (b.onclick = () => run(b, () => api(`/admin/trends/${b.dataset.ign}`, { method: \"PATCH\", body: { status: \"ignored\" } }), \"Tendencia ignorada\").then(() => route())));\r\n}\r\n\r\n// ---------- Fuentes ----------\r\nasync function viewFuentes(el) {\r\n  const sources = await api(\"/admin/sources\");\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Fuentes de información</h1><p>Periódicos, revistas, Google Trends por país, GDELT y feeds JSON (por ejemplo TikTok Creative Center vía proveedor). Se leen cada ${esc(\"INGEST_EVERY_MIN\")} minutos.</p></div>\r\n    <div class=\"row\"><button class=\"btn\" id=\"sRun\">Leer fuentes ahora</button><button class=\"btn primary\" id=\"sAdd\">+ Agregar fuente</button></div></div>\r\n    <div class=\"tablewrap\"><table><thead><tr><th>Fuente</th><th>Tipo</th><th>Categoría</th><th>Última lectura</th><th>Resultado</th><th>Activa</th></tr></thead><tbody>\r\n    ${sources.map((s) => `<tr><td><div class=\"t\">${esc(s.name)}</div><span class=\"faint\" style=\"font-size:11px;word-break:break-all\">${esc(s.url)}</span></td><td>${esc(s.kind)}</td><td>${esc(s.category ? catName(s.category) : \"Automática\")}</td><td style=\"white-space:nowrap\">${s.last_fetched_at ? ago(s.last_fetched_at) : \"Nunca\"}</td>\r\n      <td class=\"${(s.last_status ?? \"\").startsWith(\"error\") ? \"bad\" : \"muted\"}\" style=\"font-size:12px\">${esc(s.last_status ?? \"—\")}</td><td><input type=\"checkbox\" data-en=\"${s.id}\" ${s.enabled ? \"checked\" : \"\"} aria-label=\"Activa\"></td></tr>`).join(\"\")}\r\n    </tbody></table></div>`;\r\n  el.querySelector(\"#sRun\").onclick = (e) => run(e.target, () => api(\"/admin/ingest/run\", { method: \"POST\", body: {} }), (r) => `${r.sources.reduce((a, s) => a + s.inserted, 0)} artículos nuevos · ${r.trends} tendencias`).then(() => route());\r\n  el.querySelector(\"#sAdd\").onclick = async () => {\r\n    const r = await modal({ title: \"Agregar fuente\", ok: \"Agregar\", fields: [\r\n      { id: \"kind\", label: \"Tipo\", type: \"select\", options: [[\"rss\", \"RSS / Atom\"], [\"google_trends\", \"Google Trends (RSS por país)\"], [\"gdelt\", \"GDELT\"], [\"newsapi\", \"NewsAPI\"], [\"json_feed\", \"Feed JSON\"], [\"tiktok_cc\", \"TikTok Creative Center (feed JSON)\"]] },\r\n      { id: \"name\", label: \"Nombre\", placeholder: \"El Comercio\" }, { id: \"url\", label: \"URL\", type: \"url\", placeholder: \"https://…/rss\" },\r\n      { id: \"category\", label: \"Categoría fija (opcional)\", type: \"select\", options: [[\"\", \"Automática (por palabras clave)\"], ...CATS.map((c) => [c.slug, c.name])] }] });\r\n    if (r) run(null, () => api(\"/admin/sources\", { method: \"POST\", body: { kind: r.kind, name: r.name, url: r.url, category: r.category || null } }), \"Fuente agregada\").then(() => route());\r\n  };\r\n  el.querySelectorAll(\"[data-en]\").forEach((c) => (c.onchange = () => run(null, () => api(`/admin/sources/${c.dataset.en}`, { method: \"PATCH\", body: { enabled: c.checked } }), c.checked ? \"Fuente activada\" : \"Fuente desactivada\")));\r\n}\r\n\r\n// ---------- Riesgo ----------\r\nasync function viewRiesgo(el) {\r\n  const r = await api(\"/admin/exposure\");\r\n  const rows = r.markets.filter((m) => m.house_cost > 0 || m.players_yes > 0 || m.players_no > 0);\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Riesgo de la casa</h1><p>El market maker de la casa da liquidez a ambos lados. Aquí ves su inventario y dinero comprometido por mercado.</p></div><button class=\"btn\" id=\"mmRefresh\">Recotizar ahora</button></div>\r\n    <div class=\"kpis\" style=\"margin-bottom:14px\"><div class=\"kpi\"><span class=\"k\">Comprometido en posiciones</span><span class=\"v\">${kmoney(r.house.open_cost)}</span></div><div class=\"kpi\"><span class=\"k\">Resultado realizado</span><span class=\"v ${r.house.realized >= 0 ? \"ok\" : \"bad\"}\">${money(r.house.realized)}</span></div><div class=\"kpi\"><span class=\"k\">Comisiones cobradas</span><span class=\"v\">${money(r.house.fees)}</span></div><div class=\"kpi\"><span class=\"k\">Mercados con exposición</span><span class=\"v\">${rows.filter((m) => m.house_cost > 0).length}</span></div></div>\r\n    <div class=\"tablewrap\"><table><thead><tr><th>Mercado</th><th>Estado</th><th class=\"num\">Precio</th><th class=\"num\">Justo</th><th class=\"num\">Casa Sí</th><th class=\"num\">Casa No</th><th class=\"num\">Comprometido</th><th class=\"num\">Jugadores Sí / No</th><th class=\"num\">Volumen</th></tr></thead><tbody>\r\n    ${rows.length ? rows.slice(0, 200).map((m) => `<tr><td><div class=\"t\">${esc(m.question)}</div></td><td>${pill(m.status)}</td><td class=\"num\">${m.last_price}¢</td><td class=\"num\">${m.fair_price}¢</td><td class=\"num\">${(m.house_yes / 100).toLocaleString(\"es-EC\")}</td><td class=\"num\">${(m.house_no / 100).toLocaleString(\"es-EC\")}</td><td class=\"num\">${money(m.house_cost)}</td><td class=\"num\">${(m.players_yes / 100).toLocaleString(\"es-EC\")} / ${(m.players_no / 100).toLocaleString(\"es-EC\")}</td><td class=\"num\">${kmoney(m.volume)}</td></tr>`).join(\"\") : `<tr><td colspan=\"9\" class=\"muted\" style=\"text-align:center;padding:24px\">Sin exposición todavía.</td></tr>`}\r\n    </tbody></table></div>`;\r\n  el.querySelector(\"#mmRefresh\").onclick = (e) => run(e.target, () => api(\"/admin/mm/refresh\", { method: \"POST\", body: {} }), (x) => `${x.markets} mercados recotizados`).then(() => route());\r\n}\r\n\r\n// ---------- Casinos ----------\r\nasync function viewOperadores(el) {\r\n  const ops = await api(\"/admin/operators\");\r\n  el.innerHTML = `<div class=\"head\"><div><h1>Casinos</h1><p>Operadores integrados por API. Cada uno usa su propia billetera, marca y comisión.</p></div><button class=\"btn primary\" id=\"oAdd\">+ Agregar casino</button></div>\r\n    <div id=\"oCreds\"></div>\r\n    <div class=\"tablewrap\"><table><thead><tr><th>Casino</th><th>Clave pública</th><th>Billetera</th><th>Webhook</th><th class=\"num\">Comisión</th><th>Moneda</th><th>Estado</th></tr></thead><tbody>\r\n    ${ops.length ? ops.map((o) => `<tr><td><div class=\"t\">${esc(o.theme?.brandName ?? o.name)}</div><span class=\"faint\" style=\"font-size:11px\">${esc(o.id)}</span></td><td class=\"num\" style=\"font-size:12px\">${esc(o.api_key)}</td><td style=\"font-size:12px;word-break:break-all\">${esc(o.wallet_url)}</td><td style=\"font-size:12px;word-break:break-all\">${esc(o.webhook_url ?? \"—\")}</td><td class=\"num\">${o.fee_bps == null ? \"Global\" : (o.fee_bps / 100).toFixed(2) + \"%\"}</td><td>${esc(o.currency)}</td><td>${o.active ? `<span class=\"pill open\">Activo</span>` : `<span class=\"pill void\">Inactivo</span>`}</td></tr>`).join(\"\") : `<tr><td colspan=\"7\" class=\"muted\" style=\"text-align:center;padding:24px\">Aún no hay casinos.</td></tr>`}\r\n    </tbody></table></div>`;\r\n  el.querySelector(\"#oAdd\").onclick = async () => {\r\n    const r = await modal({ title: \"Agregar casino\", ok: \"Crear credenciales\", fields: [\r\n      { id: \"id\", label: \"Identificador (minúsculas y guiones)\", placeholder: \"ecuabet\" }, { id: \"name\", label: \"Nombre\", placeholder: \"Ecuabet\" },\r\n      { id: \"walletUrl\", label: \"URL de la billetera\", type: \"url\", placeholder: \"https://api.casino.com/predicciones/wallet\" }, { id: \"webhookUrl\", label: \"URL de webhooks (opcional)\", type: \"url\" },\r\n      { id: \"feeBps\", label: \"Comisión en puntos básicos (200 = 2%, vacío = global)\", type: \"number\" }, { id: \"primary\", label: \"Color de marca\", type: \"color\", value: \"#ffd400\" }] });\r\n    if (!r) return;\r\n    const out = await run(null, () => api(\"/admin/operators\", { method: \"POST\", body: { id: r.id, name: r.name, walletUrl: r.walletUrl, ...(r.webhookUrl ? { webhookUrl: r.webhookUrl } : {}), ...(r.feeBps ? { feeBps: Number(r.feeBps) } : {}), theme: { brandName: r.name, primary: r.primary } } }), \"Casino creado\");\r\n    if (!out) return;\r\n    await viewOperadores(el);\r\n    el.querySelector(\"#oCreds\").innerHTML = `<div class=\"panel\" style=\"margin-bottom:14px;border-color:var(--brand)\"><h2>Credenciales de ${esc(out.id)} <small>se muestran una sola vez</small></h2>\r\n      <div class=\"creds\"><span>X-Operator-Key: <b>${esc(out.apiKey)}</b></span><span>API secret: <b>${esc(out.apiSecret)}</b></span><span>Wallet secret: <b>${esc(out.walletSecret)}</b></span></div>\r\n      <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn sm\" id=\"oCopy\">Copiar</button><span class=\"faint\" style=\"font-size:12px\">Envíalas al casino por un canal seguro junto con la guía de integración.</span></div></div>`;\r\n    el.querySelector(\"#oCopy\").onclick = () => navigator.clipboard?.writeText(`X-Operator-Key: ${out.apiKey}\\nAPI secret: ${out.apiSecret}\\nWallet secret: ${out.walletSecret}`).then(() => toast(\"Copiado\"), () => toast(\"Selecciona y copia el texto manualmente\", true));\r\n  };\r\n}\r\n\r\n// ---------- Arranque ----------\r\nif (A.key) start().catch(() => logout()); else { document.getElementById(\"login\").hidden = false; if (A.api) document.getElementById(\"lkApi\").value = A.api; if (A.user) document.getElementById(\"lkUser\").value = A.user; }\r\n<\/script>\r\n</body>\r\n</html>\r\n";
(function () {
  const stage = document.getElementById("stage");
  const frames = {};
  const placeholders = {
    casino: ["Casino", "Esta pestaña es del casino anfitrión. El módulo nuevo vive en Predicciones."],
    vivo: ["Casino en vivo", "Esta pestaña es del casino anfitrión. El módulo nuevo vive en Predicciones."],
    deportes: ["Deportes", "Esta pestaña es del casino anfitrión. El módulo nuevo vive en Predicciones."],
  };
  function show(v) {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
    Object.values(frames).forEach((f) => (f.hidden = true));
    stage.querySelectorAll(".placeholder").forEach((p) => p.remove());
    if (v === "pred" || v === "admin") {
      if (!frames[v]) {
        const f = document.createElement("iframe");
        f.title = v === "pred" ? "Predicciones" : "Back-office de Predicciones";
        f.srcdoc = v === "pred" ? EMBED_HTML : ADMIN_HTML;
        stage.appendChild(f);
        frames[v] = f;
      }
      frames[v].hidden = false;
    } else {
      const [h, t] = placeholders[v];
      stage.insertAdjacentHTML("beforeend", `<div class="placeholder"><div><h2>${h}</h2><p>${t}</p></div></div>`);
    }
  }
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.v)));
  document.getElementById("loading").remove();
  show(location.hash === "#backoffice" ? "admin" : "pred");

  const bal = document.getElementById("bal");
  const fmt = (m) => "$" + (m / 1e6).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  setInterval(() => (bal.textContent = fmt(DEMO.balance())), 1000);

  const botsBtn = document.getElementById("bots");
  botsBtn.addEventListener("click", () => { DEMO.setBots(!DEMO.botsOn()); botsBtn.textContent = `Jugadores simulados: ${DEMO.botsOn() ? "activos" : "en pausa"}`; });
})();
