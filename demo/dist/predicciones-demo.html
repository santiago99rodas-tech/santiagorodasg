    if (r.status === "rejected") throw conflict("rejected", "La propuesta fue rechazada");
    if (!force && new Date(r.challenge_ends_at) > new Date(now())) throw conflict("challenge_window", "La ventana de disputa sigue abierta");

oin=\"round\">${I[k] ?? I.sociedad}</svg>`;\r\nconst esc = (s) => String(s ?? \"\").replace(/[&<>\"]/g, (c) => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\" }[c]));\r\nconst money = (m) => \"$\" + (m / 1e6).toLocaleString(\"es-EC\", { minimumFractionDigits: 2, maximumFractionDigits: 2 });\r\nconst kmoney = (m) => { const u = m / 1e6; return u >= 1e6 ? \"$\" + (u / 1e6).toLocaleString(\"es-EC\", { maximumFractionDigits: 2 }) + \" M\" : u >= 1e4 ? \"$\" + (u / 1e3).toLocaleString(\"es-EC\", { maximumFractionDigits: 1 }) + \" k\" : \"$\" + u.toLocaleString(\"es-EC\", { maximumFractionDigits: 0 }); };\r\nconst pts = (d) => (d > 0 ? \"▲ +\" : d < 0 ? \"▼ \" : \"\") + d + (Math.abs(d) === 1 ? \" pt\" : \" pts\");\r\nconst odds = (c) => (100 / Math.max(1, c)).toFixed(2);\r\nconst fmtDate = (d) => new Date(d).toLocaleDateString(\"es-EC\", { day: \"numeric\", month: \"short\", year: \"numeric\" });\r\nconst catName = (slug) => S.cats.find((c) => c.slug === slug)?.name ?? slug;\r\nfunction toast(t) { const el = document.getElementById(\"toast\"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3500); }\r\n\r\nasync function api(path, opts = {}) {\r\n  const r = await fetch(path, { ...opts, headers: { \"content-type\": \"application/json\", ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}), ...(opts.headers ?? {}) } });\r\n  const body = await r.json().catch(() => ({}));\r\n  if (!r.ok) throw Object.assign(new Error(body.message ?? `Error ${r.status}`), { code: body.error });\r\n  return body;\r\n}\r\n\r\n// ---------- Gráficas ----------\r\nfunction lineChart(el, data, o) {\r\n  if (!data.length) { el.innerHTML = \"\"; return; }\r\n  if (data.length === 1) data = [data[0], data[0]];\r\n  const W = Math.max(120, el.clientWidth), H = el.clientHeight || 200, ax = o.axis;\r\n  const pad = ax ? { l: 8, r: 40, t: 10, b: 22 } : { l: 2, r: 2, t: 4, b: 2 };\r\n  const ys = data.map((d) => d[1]), yMin = o.yMin ?? Math.min(...ys), yMax = o.yMax ?? Math.max(...ys), span = yMax - yMin || 1;\r\n  const t0 = +data[0][0], t1 = +data[data.length - 1][0] || t0 + 1;\r\n  const x = (t) => pad.l + ((+t - t0) / ((t1 - t0) || 1)) * (W - pad.l - pad.r);\r\n  const y = (v) => pad.t + (1 - (v - yMin) / span) * (H - pad.t - pad.b);\r\n  const path = data.map((d, i) => (i ? \"L\" : \"M\") + x(d[0]).toFixed(1) + \" \" + y(d[1]).toFixed(1)).join(\"\");\r\n  const gid = \"g\" + Math.random().toString(36).slice(2, 8);\r\n  let grid = \"\";\r\n  if (ax) {\r\n    o.ticks.forEach((t) => { grid += `<line x1=\"${pad.l}\" x2=\"${W - pad.r}\" y1=\"${y(t)}\" y2=\"${y(t)}\" stroke=\"var(--grid)\"/><text x=\"${W - pad.r + 6}\" y=\"${y(t) + 4}\">${o.fmtY(t, true)}</text>`; });\r\n    for (let k = 0; k <= 3; k++) { const t = t0 + (k / 3) * (t1 - t0); grid += `<text x=\"${x(t)}\" y=\"${H - 5}\" text-anchor=\"${k === 0 ? \"start\" : k === 3 ? \"end\" : \"middle\"}\">${o.fmtX(new Date(t), true)}</text>`; }\r\n  }\r\n  const last = data[data.length - 1];\r\n  el.innerHTML = `<svg width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"${esc(o.label ?? \"\")}\">\r\n    <defs><linearGradient id=\"${gid}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"${o.color}\" stop-opacity=\".28\"/><stop offset=\"1\" stop-color=\"${o.color}\" stop-opacity=\"0\"/></linearGradient></defs>\r\n    ${grid}<path d=\"${path}L${x(last[0])} ${H - pad.b}L${x(data[0][0])} ${H - pad.b}Z\" fill=\"url(#${gid})\"/>\r\n    <path d=\"${path}\" fill=\"none\" stroke=\"${o.color}\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\r\n    <circle cx=\"${x(last[0])}\" cy=\"${y(last[1])}\" r=\"4\" fill=\"${o.color}\" stroke=\"var(--card)\" stroke-width=\"2\"/>\r\n    <g class=\"hov\" style=\"display:none\"><line y1=\"${pad.t}\" y2=\"${H - pad.b}\" stroke=\"var(--muted)\" stroke-dasharray=\"3 3\"/><circle r=\"4.5\" fill=\"${o.color}\" stroke=\"var(--card)\" stroke-width=\"2\"/></g></svg><div class=\"tip\" hidden></div>`;\r\n  const s = el.querySelector(\"svg\"), g = s.querySelector(\".hov\"), tip = el.querySelector(\".tip\");\r\n  const move = (e) => {\r\n    const r = s.getBoundingClientRect(), px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;\r\n    const tt = t0 + ((px - pad.l) / (W - pad.l - pad.r)) * (t1 - t0);\r\n    let i = 0; for (let k = 0; k < data.length; k++) if (+data[k][0] <= tt) i = k;\r\n    const cx = x(data[i][0]), cy = y(data[i][1]);\r\n    g.style.display = \"\"; g.querySelector(\"line\").setAttribute(\"x1\", cx); g.querySelector(\"line\").setAttribute(\"x2\", cx);\r\n    g.querySelector(\"circle\").setAttribute(\"cx\", cx); g.querySelector(\"circle\").setAttribute(\"cy\", cy);\r\n    tip.hidden = false; tip.style.left = Math.max(60, Math.min(W - 60, cx)) + \"px\"; tip.style.top = cy + \"px\";\r\n    tip.innerHTML = `<b>${o.fmtY(data[i][1], false)}</b><small>${o.fmtX(new Date(data[i][0]), false)}</small>`;\r\n  };\r\n  s.addEventListener(\"pointermove\", move); s.addEventListener(\"pointerleave\", () => { g.style.display = \"none\"; tip.hidden = true; });\r\n}\r\nfunction miniLine(vals, color) {\r\n  if (vals.length < 2) vals = [vals[0] ?? 50, vals[0] ?? 50];\r\n  const W = 100, H = 30, mn = Math.min(...vals), mx = Math.max(...vals), sp = mx - mn || 1;\r\n  const p = vals.map((v, i) => (i ? \"L\" : \"M\") + ((i / (vals.length - 1)) * W).toFixed(1) + \" \" + (2 + (1 - (v - mn) / sp) * (H - 4)).toFixed(1)).join(\"\");\r\n  return `<svg viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\" width=\"100%\" height=\"30\" aria-hidden=\"true\"><path d=\"${p}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"/></svg>`;\r\n}\r\nconst hourFmt = (d, short) => short ? d.toLocaleTimeString(\"es-EC\", { hour: \"2-digit\", minute: \"2-digit\" }) : d.toLocaleString(\"es-EC\", { weekday: \"short\", hour: \"2-digit\", minute: \"2-digit\" });\r\nconst dayFmt = (d, short) => short ? d.toLocaleDateString(\"es-EC\", { day: \"numeric\", month: \"short\" }) : d.toLocaleString(\"es-EC\", { day: \"numeric\", month: \"short\", hour: \"2-digit\", minute: \"2-digit\" });\r\n\r\n// ---------- Render ----------\r\nfunction renderHeader() {\r\n  const theme = S.me?.operator?.theme ?? {};\r\n  if (theme.primary) document.documentElement.style.setProperty(\"--brand\", theme.primary);\r\n  document.getElementById(\"brand\").innerHTML = `${esc(theme.brandName ?? S.me?.operator?.name ?? \"Predicciones\")}<small>Predicciones</small>`;\r\n  document.getElementById(\"balWrap\").hidden = !S.me;\r\n  if (S.me) document.getElementById(\"bal\").textContent = S.me.balance == null ? \"—\" : money(S.me.balance);\r\n  document.getElementById(\"readonly\").hidden = Boolean(S.me);\r\n  document.getElementById(\"mineBtn\").hidden = !S.me;\r\n}\r\n\r\nfunction renderTicker() {\r\n  const items = S.events.flatMap((e) => e.markets.slice(0, e.kind === \"multi\" ? 2 : 1).map((m) => `<span>${esc(e.kind === \"multi\" ? `${e.title} · ${m.label}` : e.title)} <b class=\"num\">${m.price}%</b> <span class=\"num ${m.change24h > 0 ? \"up\" : m.change24h < 0 ? \"down\" : \"\"}\">${m.change24h ? pts(m.change24h) : \"=\"}</span></span>`)).join(\"\");\r\n  document.getElementById(\"ticker\").innerHTML = items + items;\r\n}\r\n\r\nasync function renderKpis() {\r\n  const s = S.stats; if (!s) return;\r\n  document.getElementById(\"kVol\").textContent = kmoney(s.volume_24h);\r\n  const ch = s.volume_prev_24h ? ((s.volume_24h - s.volume_prev_24h) / s.volume_prev_24h) * 100 : null;\r\n  const d = document.getElementById(\"kVolD\");\r\n  d.textContent = ch == null ? `${s.trades_24h} apuestas` : `${ch >= 0 ? \"▲\" : \"▼\"} ${Math.abs(ch).toFixed(1).replace(\".\", \",\")}% vs. ayer · ${s.trades_24h} apuestas`;\r\n  d.className = \"d \" + (ch == null ? \"\" : ch >= 0 ? \"up\" : \"down\");\r\n  document.getElementById(\"kUsers\").textContent = s.players_online.toLocaleString(\"es-EC\");\r\n  document.getElementById(\"kUsersD\").textContent = \"activos en los últimos 5 min\";\r\n  document.getElementById(\"kOpen\").textContent = s.open_events;\r\n  document.getElementById(\"kOpenD\").textContent = `${s.new_events_24h} nuevos · ${s.closing_24h} cierran hoy`;\r\n  let acc = 0;\r\n  const cum = s.hourlyVolume.map((h) => [new Date(h.t), (acc += h.volume)]);\r\n  lineChart(document.getElementById(\"sVol\"), cum, { color: \"var(--brand)\", fmtY: (v) => kmoney(v) + \" acumulado\", fmtX: (t) => hourFmt(t), label: \"Volumen acumulado 24 h\" });\r\n  const top = s.movers[0];\r\n  const km = document.getElementById(\"kMove\");\r\n  if (top) {\r\n    km.textContent = pts(top.change24h); km.className = \"v \" + (top.change24h >= 0 ? \"up\" : \"down\");\r\n    document.getElementById(\"kMoveQ\").textContent = top.label ? `${top.title} · ${top.label}` : top.title;\r\n    const h = await api(`/v1/markets/${top.marketId}/prices-history?interval=1d`);\r\n    lineChart(document.getElementById(\"sMove\"), h.map((p) => [new Date(p.t), p.p]), { color: top.change24h >= 0 ? \"var(--up)\" : \"var(--down)\", fmtY: (v) => v + \"% Sí\", fmtX: (t) => hourFmt(t), label: \"Mercado con mayor movimiento\" });\r\n  } else { km.textContent = \"—\"; document.getElementById(\"kMoveQ\").textContent = \"Sin movimientos todavía\"; }\r\n}\r\n\r\nfunction renderCats() {\r\n  const list = S.cats.filter((c) => c.open_events > 0);\r\n  document.getElementById(\"cats\").innerHTML = list.map((c) => {\r\n    const [, g, ic] = cc(c.slug);\r\n    return `<button type=\"button\" class=\"ctile${S.cat === c.slug ? \" on\" : \"\"}\" data-cat=\"${c.slug}\" style=\"background:${g}\"><div class=\"ill\" style=\"color:${ic}\">${svg(c.slug, 60)}</div><span>${esc(c.name)}<small>${c.open_events}</small></span></button>`;\r\n  }).join(\"\");\r\n}\r\n\r\nfunction renderBoard() {\r\n  const s = S.stats; if (!s) return;\r\n  const list = s.movers.filter((m) => (S.mv === \"up\" ? m.change24h > 0 : m.change24h < 0)).slice(0, 6);\r\n  const max = Math.max(1, ...s.movers.map((m) => Math.abs(m.change24h)));\r\n  document.getElementById(\"movers\").innerHTML = list.length ? list.map((m) => {\r\n    const w = (Math.abs(m.change24h) / max) * 50;\r\n    const bar = m.change24h >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`;\r\n    return `<button type=\"button\" class=\"mv\" data-open=\"${m.eventId}\" data-market=\"${m.marketId}\"><span class=\"t\">${esc(m.label ? `${m.title} · ${m.label}` : m.title)}<small>${esc(catName(m.category))} · ${m.price}% Sí</small></span><span class=\"b\" aria-hidden=\"true\"><i style=\"${bar}\"></i></span><span class=\"d ${m.change24h >= 0 ? \"up\" : \"down\"}\">${m.change24h >= 0 ? \"▲ +\" : \"▼ \"}${m.change24h}</span></button>`;\r\n  }).join(\"\") : `<div class=\"empty\">Sin movimientos en este sentido todavía.</div>`;\r\n  const vc = s.byCategory.filter((c) => c.volume > 0);\r\n  const vmax = Math.max(1, ...vc.map((c) => c.volume)), total = vc.reduce((a, c) => a + c.volume, 0);\r\n  document.getElementById(\"volcat\").innerHTML = vc.length ? vc.map((c) =>\r\n    `<button type=\"button\" class=\"vb\" data-cat=\"${c.category}\" title=\"${esc(c.name)}: ${money(c.volume)} · ${Math.round((c.volume / total) * 100)}%\"><span>${esc(c.name)}</span><span class=\"bar\"><i style=\"width:${((c.volume / vmax) * 100).toFixed(1)}%\"></i></span><span class=\"v\">${kmoney(c.volume)}</span></button>`).join(\"\")\r\n    : `<div class=\"empty\">Aún no hay apuestas en las últimas 24 h.</div>`;\r\n}\r\n\r\nconst AVC = [\"#ffd400\", \"#7dd3fc\", \"#f9a8d4\", \"#86efac\", \"#fdba74\", \"#c4b5fd\"];\r\nfunction renderFeed(fresh) {\r\n  document.getElementById(\"feed\").innerHTML = S.feed.length ? S.feed.slice(0, 8).map((b, i) => {\r\n    const initials = b.player.split(\" \").map((w) => w[0]).join(\"\").slice(0, 2);\r\n    const yes = b.outcome === \"YES\";\r\n    return `<div class=\"fi${fresh && i === 0 ? \" new\" : \"\"}\"><span class=\"av\" style=\"background:${AVC[b.player.length % AVC.length]}\">${esc(initials)}</span>\r\n      <div class=\"w\"><div>${esc(b.player)} · <span class=\"${yes ? \"up\" : \"down\"}\">${b.side === \"SELL\" ? \"vende \" : \"\"}${yes ? \"Sí\" : \"No\"}</span>${b.outcomeLabel ? ` · ${esc(b.outcomeLabel)}` : \"\"}</div><div><small>${esc(b.eventTitle)}</small></div></div>\r\n      <span class=\"amt\">${money(b.amount)}<small class=\"${yes ? \"up\" : \"down\"}\">${b.price}¢</small></span></div>`;\r\n  }).join(\"\") : `<div class=\"empty\">Todavía no hay apuestas. ¡Sé el primero!</div>`;\r\n  document.getElementById(\"feedCount\").textContent = S.stats ? `${S.stats.trades_24h.toLocaleString(\"es-EC\")} hoy` : \"\";\r\n}\r\n\r\n// Lista paginada del servidor según categoría, orden y búsqueda\r\nconst PAGE = 48;\r\nasync function fetchList(reset = true) {\r\n  const params = new URLSearchParams({ limit: String(PAGE), offset: String(reset ? 0 : S.list.length), spark: \"1\", sort: S.sort });\r\n  if (S.cat) params.set(\"category\", S.cat);\r\n  if (S.q) params.set(\"q\", S.q);\r\n  const page = await api(`/v1/events?${params}`);\r\n  S.list = reset ? page : [...S.list, ...page];\r\n  S.more = page.length === PAGE;\r\n  renderGrid();\r\n}\r\nfunction filteredEvents() { return S.list; }\r\n\r\nfunction renderGrid() {\r\n  document.getElementById(\"listTitle\").innerHTML = `<svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M7 4h10v5a5 5 0 0 1-10 0zM7 6H3c0 3 2 5 4 5M17 6h4c0 3-2 5-4 5M12 14v4M8 21h8M9 18h6\"/></svg>`\r\n    + (S.view === \"mine\" ? \"Mis predicciones\" : S.cat ? `${esc(catName(S.cat))}: mercados abiertos<button type=\"button\" class=\"aside\" id=\"clear\">Ver todos</button>` : \"Mercados más apostados\");\r\n  document.getElementById(\"grid\").hidden = S.view !== \"markets\";\r\n  document.getElementById(\"mine\").hidden = S.view !== \"mine\";\r\n  document.getElementById(\"sortSeg\").hidden = S.view !== \"markets\";\r\n  document.getElementById(\"search\").hidden = S.view !== \"markets\";\r\n  document.getElementById(\"more\").hidden = S.view !== \"markets\" || !S.more;\r\n  if (S.view === \"mine\") return renderMine();\r\n  const list = filteredEvents();\r\n  document.getElementById(\"grid\").innerHTML = list.length ? list.map((e, idx) => {\r\n    const [chip, g, ic] = cc(e.category);\r\n    const m0 = e.markets[0];\r\n    const moving = e.markets.some((m) => Math.abs(m.change24h) >= 4);\r\n    const head = `<div class=\"pic\" style=\"background:${g};color:${ic}\">${S.sort === \"volume24h\" && !S.q ? `<span class=\"rank\">${idx + 1}</span>` : \"\"}${moving ? `<span class=\"hotb\">🔥 MOVIÉNDOSE</span>` : \"\"}${svg(e.category, 40, \"big\")}<span class=\"badge\" style=\"background:${chip}\">${esc(catName(e.category))}</span></div>`;\r\n    let body;\r\n    if (e.kind === \"binary\") {\r\n      const up = m0.change24h >= 0;\r\n      body = `<div class=\"pr\"><span class=\"p\">${m0.price}%<small>Sí</small></span><span class=\"d ${m0.change24h > 0 ? \"up\" : m0.change24h < 0 ? \"down\" : \"\"}\">${m0.change24h ? pts(m0.change24h) : \"\"}</span></div>\r\n        <div class=\"mini\">${miniLine([...(m0.spark ?? []), m0.price], up ? \"var(--up)\" : \"var(--down)\")}</div>\r\n        <div class=\"yn\"><span class=\"y\">Sí ${m0.price}¢</span><span class=\"n\">No ${100 - m0.price}¢</span></div>`;\r\n    } else {\r\n      const top = [...e.markets].sort((a, b) => b.price - a.price).slice(0, 3);\r\n      body = `<div class=\"opts\">${top.map((m) => `<div class=\"opt\"><i style=\"width:${m.price}%\"></i><span>${esc(m.label)}</span><b>${m.price}%</b></div>`).join(\"\")}${e.markets.length > 3 ? `<small style=\"color:var(--faint);font-size:11px\">+${e.markets.length - 3} opciones</small>` : \"\"}</div>`;\r\n    }\r\n    return `<button type=\"button\" class=\"q\" data-open=\"${e.id}\">${head}<div class=\"body\"><div class=\"txt\">${esc(e.title)}</div>${body}\r\n      <div class=\"vol\"><span>${kmoney(e.volume)} apostado</span><span>${e.traders} jugador${e.traders === 1 ? \"\" : \"es\"}</span></div></div></button>`;\r\n  }).join(\"\") : `<div class=\"empty-big\">No hay mercados abiertos que coincidan.</div>`;\r\n}\r\n\r\nfunction renderMine() {\r\n  const el = document.getElementById(\"mine\");\r\n  const open = S.positions.filter((p) => p.shares > 0);\r\n  const closed = S.positions.filter((p) => p.shares === 0);\r\n  const rowsOpen = open.map((p) => `<tr>\r\n    <td><b>${esc(p.eventTitle)}</b>${p.outcomeLabel ? `<br><small style=\"color:var(--muted)\">${esc(p.outcomeLabel)}</small>` : \"\"}</td>\r\n    <td><span class=\"pill ${p.outcome === \"YES\" ? \"up\" : \"down\"}\">${p.outcome === \"YES\" ? \"Sí\" : \"No\"}</span></td>\r\n    <td class=\"num\">${p.shares.toLocaleString(\"es-EC\")}</td><td class=\"num\">${p.avgPrice ?? \"—\"}¢</td><td class=\"num\">${p.currentPrice}¢</td>\r\n    <td class=\"num\">${money(p.value)}</td><td class=\"num ${p.unrealizedPnl >= 0 ? \"up\" : \"down\"}\">${p.unrealizedPnl >= 0 ? \"+\" : \"\"}${money(p.unrealizedPnl)}</td>\r\n    <td>${p.marketStatus === \"open\" && p.availableShares > 0 ? `<button type=\"button\" class=\"btn-s\" data-sell=\"${p.marketId}\" data-outcome=\"${p.outcome}\" data-shares=\"${p.availableShares}\">Vender</button>` : `<small style=\"color:var(--muted)\">${p.marketStatus === \"open\" ? \"\" : \"Cerrado\"}</small>`}</td></tr>`).join(\"\");\r\n  const rowsClosed = closed.map((p) => `<tr><td>${esc(p.eventTitle)}${p.outcomeLabel ? ` · ${esc(p.outcomeLabel)}` : \"\"}</td><td>${p.outcome === \"YES\" ? \"Sí\" : \"No\"}</td><td class=\"num ${p.realizedPnl >= 0 ? \"up\" : \"down\"}\">${p.realizedPnl >= 0 ? \"+\" : \"\"}${money(p.realizedPnl)}</td><td>${p.resolvedOutcome ? (p.resolvedOutcome === p.outcome ? \"Ganada\" : p.resolvedOutcome === \"VOID\" ? \"Anulada\" : \"Perdida\") : \"Vendida\"}</td></tr>`).join(\"\");\r\n  el.innerHTML = `<div class=\"tablewrap\"><table class=\"table\"><thead><tr><th>Mercado</th><th>Lado</th><th class=\"num\">Acciones</th><th class=\"num\">Precio medio</th><th class=\"num\">Precio actual</th><th class=\"num\">Valor</th><th class=\"num\">G/P</th><th></th></tr></thead>\r\n    <tbody>${rowsOpen || `<tr><td colspan=\"8\" style=\"color:var(--muted)\">Aún no tienes predicciones abiertas. Elige un mercado y apuesta.</td></tr>`}</tbody></table></div>\r\n    ${S.orders.length ? `<h2 class=\"sec\" style=\"font-size:17px\">Órdenes pendientes</h2><div class=\"tablewrap\"><table class=\"table\"><thead><tr><th>Mercado</th><th>Orden</th><th class=\"num\">Precio</th><th class=\"num\">Acciones</th><th></th></tr></thead><tbody>${S.orders.map((o) => `<tr><td>${esc(o.event_title)}${o.kind === \"multi\" ? ` · ${esc(o.outcome_label)}` : \"\"}</td><td>${o.side === \"BUY\" ? \"Compra\" : \"Venta\"} ${o.outcome === \"YES\" ? \"Sí\" : \"No\"}</td><td class=\"num\">${o.price}¢</td><td class=\"num\">${Number(o.filled_shares)}/${Number(o.shares)}</td><td><button type=\"button\" class=\"btn-s\" data-cancel=\"${o.id}\">Cancelar</button></td></tr>`).join(\"\")}</tbody></table></div>` : \"\"}\r\n    ${rowsClosed ? `<h2 class=\"sec\" style=\"font-size:17px\">Historial</h2><div class=\"tablewrap\"><table class=\"table\"><thead><tr><th>Mercado</th><th>Lado</th><th class=\"num\">Resultado</th><th>Estado</th></tr></thead><tbody>${rowsClosed}</tbody></table></div>` : \"\"}`;\r\n}\r\n\r\n// ---------- Ficha del mercado ----------\r\nasync function openEvent(id, marketId) {\r\n  const e = await api(`/v1/events/${id}`);\r\n  S.open = e; S.marketId = marketId ?? e.markets[0].id; S.side = \"YES\";\r\n  renderSheet();\r\n}\r\nfunction curMarket() { return S.open?.markets.find((m) => m.id === S.marketId); }\r\nfunction buyPrice(m, side) {\r\n  // Precio estimado de compra: mejor oferta del libro, o el precio mostrado si no hay libro\r\n  if (side === \"YES\") return m.bestAsk ?? m.price;\r\n  return m.bestBid != null ? 100 - m.bestBid : 100 - m.price;\r\n}\r\nfunction renderSheet() {\r\n  const scrim = document.getElementById(\"scrim\");\r\n  if (!S.open) { scrim.hidden = true; scrim.innerHTML = \"\"; document.body.style.overflow = \"\"; return; }\r\n  const e = S.open, m = curMarket(), [chip] = cc(e.category);\r\n  const price = buyPrice(m, S.side);\r\n  const shares = S.amount > 0 ? (S.amount * 0.98) / (price / 100) : 0;\r\n  const tradable = e.status === \"open\" && m.status === \"open\";\r\n  scrim.hidden = false; document.body.style.overflow = \"hidden\";\r\n  scrim.innerHTML = `<div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"shq\">\r\n    <div class=\"sh-head\"><div><div class=\"k\" style=\"color:${chip}\">${esc(catName(e.category))} · Cierra ${fmtDate(e.closeTime)}</div><h3 id=\"shq\">${esc(e.title)}</h3></div>\r\n      <button type=\"button\" class=\"x\" id=\"close\" aria-label=\"Cerrar\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M6 6l12 12M18 6 6 18\"/></svg></button></div>\r\n    <div class=\"col\">\r\n      ${e.kind === \"multi\" ? `<div class=\"outs\">${[...e.markets].sort((a, b) => b.price - a.price).map((o) => `<button type=\"button\" class=\"out${o.id === m.id ? \" sel\" : \"\"}\" data-market=\"${o.id}\"><span>${esc(o.label)}<span class=\"ch ${o.change24h > 0 ? \"up\" : o.change24h < 0 ? \"down\" : \"\"}\">${o.change24h ? pts(o.change24h) : \"\"}</span></span><b>${o.price}%</b></button>`).join(\"\")}</div>` : \"\"}\r\n      <div class=\"chhead\"><div class=\"bigp\"><span class=\"p\">${m.price}%</span><span class=\"l\">${e.kind === \"multi\" ? `prob. de ${esc(m.label)}` : \"probabilidad del Sí\"}</span><span class=\"num ${m.change24h > 0 ? \"up\" : m.change24h < 0 ? \"down\" : \"\"}\">${m.change24h ? pts(m.change24h) + \" hoy\" : \"\"}</span></div>\r\n        <span class=\"seg\" id=\"rangeSeg\">${[[\"1d\", \"24H\"], [\"1w\", \"7D\"], [\"1m\", \"30D\"], [\"all\", \"Todo\"]].map(([k, l]) => `<button type=\"button\" data-range=\"${k}\" class=\"${S.range === k ? \"on\" : \"\"}\">${l}</button>`).join(\"\")}</span></div>\r\n      <div class=\"chart\" id=\"hist\" style=\"height:220px\"></div>\r\n      <div class=\"stats\"><div class=\"stat\"><small>Apostado</small><b>${kmoney(e.volume)}</b></div><div class=\"stat\"><small>Jugadores</small><b>${e.traders}</b></div><div class=\"stat\"><small>Cierra</small><b>${fmtDate(e.closeTime)}</b></div></div>\r\n      <div class=\"book\" id=\"book\"></div>\r\n      <div class=\"rules\"><b>Cómo se resuelve:</b> ${esc(e.resolutionCriteria)}<br><b>Fuente:</b> ${esc(e.resolutionSource)}${e.resolution ? `<br><b>Resolución:</b> ${esc(e.resolution.status)} · ${esc(e.resolution.explanation ?? \"\")}` : \"\"}</div>\r\n    </div>\r\n    <div class=\"col\">\r\n      ${e.kind === \"multi\" ? `<div style=\"font-weight:700\">${esc(m.label)}</div>` : \"\"}\r\n      <div class=\"pick2\">\r\n        <button type=\"button\" class=\"side y${S.side === \"YES\" ? \" sel\" : \"\"}\" data-side=\"YES\">Sí<small>${buyPrice(m, \"YES\")}¢ · cuota ${odds(buyPrice(m, \"YES\"))}</small></button>\r\n        <button type=\"button\" class=\"side n${S.side === \"NO\" ? \" sel\" : \"\"}\" data-side=\"NO\">No<small>${buyPrice(m, \"NO\")}¢ · cuota ${odds(buyPrice(m, \"NO\"))}</small></button>\r\n      </div>\r\n      <div class=\"amt\"><label for=\"amount\">Valor de la apuesta (USD)</label>\r\n        <input id=\"amount\" type=\"number\" min=\"1\" step=\"1\" inputmode=\"decimal\" value=\"${S.amount}\">\r\n        <div class=\"chips\">${[1, 5, 10, 25, 50, 100].map((v) => `<button type=\"button\" data-amt=\"${v}\">${v}</button>`).join(\"\")}</div></div>\r\n      <div class=\"row\"><span>Acciones aprox.</span><b id=\"estShares\">${shares.toFixed(2)}</b></div>\r\n      <div class=\"row win\"><span>Si aciertas cobras</span><b id=\"estWin\">${money(shares * 1e6)}</b></div>\r\n      <small style=\"color:var(--faint);font-size:11px\">Cada acción paga $1 si aciertas. Incluye comisión de 2% y el precio puede variar si hay poca liquidez.</small>\r\n      <button type=\"button\" class=\"place\" id=\"place\" ${!S.me || !tradable ? \"disabled\" : \"\"}>${!S.me ? \"Abre desde tu casino para apostar\" : !tradable ? \"Mercado cerrado\" : `Apostar ${S.amount} al ${S.side === \"YES\" ? \"Sí\" : \"No\"}`}</button>\r\n      <div class=\"msg\" id=\"msg\" role=\"status\"></div>\r\n    </div></div>`;\r\n  drawHist(); drawBook();\r\n}\r\nasync function drawHist() {\r\n  const m = curMarket(); if (!m) return;\r\n  const h = await api(`/v1/markets/${m.id}/prices-history?interval=${S.range}`);\r\n  const el = document.getElementById(\"hist\"); if (!el) return;\r\n  const data = h.map((p) => [new Date(p.t), p.p]);\r\n  const vals = data.map((d) => d[1]);\r\n  const lo = Math.max(0, Math.floor((Math.min(...vals) - 3) / 5) * 5), hi = Math.min(100, Math.ceil((Math.max(...vals) + 3) / 5) * 5);\r\n  const st = hi - lo > 30 ? 10 : 5, ticks = [];\r\n  for (let t = Math.ceil(lo / st) * st; t <= hi; t += st) ticks.push(t);\r\n  lineChart(el, data, { color: m.change24h >= 0 ? \"var(--up)\" : \"var(--down)\", axis: true, yMin: lo, yMax: hi, ticks, fmtY: (v, ax) => (ax ? v + \"%\" : v + \"% Sí\"), fmtX: (t, short) => (+data[data.length - 1][0] - +data[0][0] < 2 * 864e5 ? hourFmt(t, short) : dayFmt(t, short)), label: \"Historial de probabilidad\" });\r\n}\r\nasync function drawBook() {\r\n  const m = curMarket(); if (!m) return;\r\n  const b = await api(`/v1/markets/${m.id}/book`);\r\n  const el = document.getElementById(\"book\"); if (!el) return;\r\n  const side = S.side === \"YES\" ? b.yes : b.no;\r\n  const max = Math.max(1, ...side.bids.map((l) => l.shares), ...side.asks.map((l) => l.shares));\r\n  const lv = (l, c) => `<div class=\"lvl\"><i style=\"width:${(l.shares / max) * 100}%;background:${c}\"></i><span>${l.price}¢</span><span>${l.shares.toLocaleString(\"es-EC\")}</span></div>`;\r\n  el.innerHTML = `<div><h4>Compran ${S.side === \"YES\" ? \"Sí\" : \"No\"}</h4>${side.bids.slice(0, 5).map((l) => lv(l, \"var(--up)\")).join(\"\") || \"<small>—</small>\"}</div>\r\n    <div><h4>Venden ${S.side === \"YES\" ? \"Sí\" : \"No\"}</h4>${side.asks.slice(0, 5).map((l) => lv(l, \"var(--down)\")).join(\"\") || \"<small>—</small>\"}</div>`;\r\n}\r\n\r\nasync function placeBet() {\r\n  const msg = document.getElementById(\"msg\"), btn = document.getElementById(\"place\");\r\n  if (!(S.amount >= 1)) { msg.className = \"msg err\"; msg.textContent = \"La apuesta mínima es $1.\"; return; }\r\n  btn.disabled = true;\r\n  try {\r\n    const r = await api(\"/v1/orders\", { method: \"POST\", body: JSON.stringify({ marketId: S.marketId, side: \"BUY\", outcome: S.side, type: \"MARKET\", amount: S.amount }) });\r\n    msg.className = \"msg\";\r\n    msg.textContent = `Listo: ${r.filledShares.toLocaleString(\"es-EC\")} acciones a ${r.avgPrice}¢ en promedio. Pagaste ${money(r.spent)} (comisión ${money(r.fee)}).`;\r\n    toast(\"Apuesta registrada\");\r\n    await Promise.all([refreshMe(), refreshMine()]);\r\n    S.open = await api(`/v1/events/${S.open.id}`);\r\n    const keep = msg.textContent; renderSheet(); const m2 = document.getElementById(\"msg\"); m2.className = \"msg\"; m2.textContent = keep;\r\n  } catch (e) {\r\n    msg.className = \"msg err\"; msg.textContent = e.message; btn.disabled = false;\r\n  }\r\n}\r\n\r\n// ---------- Datos ----------\r\nasync function refreshMe() { if (TOKEN) { try { S.me = await api(\"/v1/me\"); } catch { S.me = null; } } renderHeader(); }\r\nasync function refreshMine() { if (!S.me) return; [S.positions, S.orders] = await Promise.all([api(\"/v1/positions\"), api(\"/v1/orders?status=open\")]); if (S.view === \"mine\") renderMine(); }\r\nasync function refreshMarkets() {\r\n  [S.events, S.stats] = await Promise.all([api(`/v1/events?limit=200&sort=volume24h`), api(\"/v1/stats\")]);\r\n  renderTicker(); renderBoard(); renderKpis(); renderFeed(false);\r\n  await fetchList(true);\r\n}\r\n\r\nfunction connectStream() {\r\n  const es = new EventSource(\"/v1/stream\");\r\n  es.addEventListener(\"trade\", (ev) => {\r\n    const t = JSON.parse(ev.data);\r\n    const e = S.events.find((x) => x.id === t.eventId) ?? S.list.find((x) => x.id === t.eventId), m = e?.markets.find((x) => x.id === t.marketId);\r\n    if (!e) return;\r\n    const price = t.outcome === \"YES\" ? t.yesPrice : 100 - t.yesPrice;\r\n    S.feed.unshift({ player: t.player, side: t.side, outcome: t.outcome, outcomeLabel: e.kind === \"multi\" ? m?.label : null, eventTitle: e.title, amount: t.amount, price });\r\n    S.feed = S.feed.slice(0, 20);\r\n    if (S.stats) S.stats.trades_24h++;\r\n    renderFeed(true);\r\n  });\r\n  es.addEventListener(\"price\", (ev) => {\r\n    const p = JSON.parse(ev.data);\r\n    for (const src of [S.events, S.list]) {\r\n      const e = src.find((x) => x.id === p.eventId), m = e?.markets.find((x) => x.id === p.marketId);\r\n      if (m) { m.change24h += p.price - m.lastPrice; m.lastPrice = p.price; m.price = p.price; dirty = true; }\r\n    }\r\n  });\r\n}\r\nlet dirty = false;\r\nsetInterval(() => { if (dirty) { dirty = false; renderTicker(); if (S.view === \"markets\") renderGrid(); } }, 2000);\r\nsetInterval(refreshMarkets, 60_000);\r\nsetInterval(refreshMe, 20_000);\r\n\r\n// ---------- Eventos de la interfaz ----------\r\ndocument.addEventListener(\"click\", async (ev) => {\r\n  const t = ev.target;\r\n  if (t.closest(\"#close\") || t === document.getElementById(\"scrim\")) { S.open = null; renderSheet(); return; }\r\n  const rg = t.closest(\"[data-range]\"); if (rg) { S.range = rg.dataset.range; document.querySelectorAll(\"#rangeSeg button\").forEach((b) => b.classList.toggle(\"on\", b === rg)); drawHist(); return; }\r\n  if (S.open) {\r\n    const om = t.closest(\".out[data-market]\"); if (om) { S.marketId = Number(om.dataset.market); renderSheet(); return; }\r\n    const sd = t.closest(\"[data-side]\"); if (sd) { S.side = sd.dataset.side; renderSheet(); return; }\r\n    const ch = t.closest(\"[data-amt]\"); if (ch) { S.amount = Number(ch.dataset.amt); renderSheet(); return; }\r\n    if (t.closest(\"#place\")) return placeBet();\r\n    return;\r\n  }\r\n  const op = t.closest(\"[data-open]\"); if (op) return openEvent(Number(op.dataset.open), op.dataset.market ? Number(op.dataset.market) : undefined).catch((e) => toast(e.message));\r\n  const cat = t.closest(\"[data-cat]\"); if (cat) { S.cat = S.cat === cat.dataset.cat ? null : cat.dataset.cat; S.view = \"markets\"; syncSeg(\"viewSeg\", \"markets\"); renderCats(); await fetchList(true); document.getElementById(\"listTitle\").scrollIntoView({ behavior: \"smooth\" }); return; }\r\n  if (t.closest(\"#clear\")) { S.cat = null; renderCats(); await fetchList(true); return; }\r\n  if (t.closest(\"#more\")) { await fetchList(false); return; }\r\n  const mv = t.closest(\"[data-mv]\"); if (mv) { S.mv = mv.dataset.mv; syncSeg(\"mvSeg\", S.mv, \"mv\"); renderBoard(); return; }\r\n  const so = t.closest(\"[data-sort]\"); if (so) { S.sort = so.dataset.sort; syncSeg(\"sortSeg\", S.sort, \"sort\"); await fetchList(true); return; }\r\n  const vw = t.closest(\"[data-view]\"); if (vw) { S.view = vw.dataset.view; syncSeg(\"viewSeg\", S.view, \"view\"); if (S.view === \"mine\") await refreshMine(); renderGrid(); return; }\r\n  const sell = t.closest(\"[data-sell]\"); if (sell) {\r\n    sell.disabled = true;\r\n    try {\r\n      const r = await api(\"/v1/orders\", { method: \"POST\", body: JSON.stringify({ marketId: Number(sell.dataset.sell), side: \"SELL\", outcome: sell.dataset.outcome, type: \"MARKET\", shares: Number(sell.dataset.shares) }) });\r\n      toast(`Vendiste ${r.filledShares} acciones: recibes ${money(r.spent)}`);\r\n      await Promise.all([refreshMe(), refreshMine()]);\r\n    } catch (e) { toast(e.message); sell.disabled = false; }\r\n    return;\r\n  }\r\n  const cn = t.closest(\"[data-cancel]\"); if (cn) { try { await api(`/v1/orders/${cn.dataset.cancel}`, { method: \"DELETE\" }); toast(\"Orden cancelada\"); await Promise.all([refreshMe(), refreshMine()]); } catch (e) { toast(e.message); } }\r\n});\r\nfunction syncSeg(id, val, key = \"view\") { document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle(\"on\", b.dataset[key] === val)); }\r\ndocument.addEventListener(\"input\", (ev) => {\r\n  if (ev.target.id === \"search\") { S.q = ev.target.value.trim(); clearTimeout(fetchList.t); fetchList.t = setTimeout(() => fetchList(true), 300); return; }\r\n  if (ev.target.id !== \"amount\") return;\r\n  S.amount = Math.max(0, Number(ev.target.value) || 0);\r\n  const m = curMarket(), price = buyPrice(m, S.side), shares = S.amount > 0 ? (S.amount * 0.98) / (price / 100) : 0;\r\n  document.getElementById(\"estShares\").textContent = shares.toFixed(2);\r\n  document.getElementById(\"estWin\").textContent = money(shares * 1e6);\r\n  const btn = document.getElementById(\"place\"); if (S.me && !btn.disabled) btn.textContent = `Apostar ${S.amount} al ${S.side === \"YES\" ? \"Sí\" : \"No\"}`;\r\n});\r\ndocument.addEventListener(\"keydown\", (ev) => { if (ev.key === \"Escape\" && S.open) { S.open = null; renderSheet(); } });\r\nlet rz; addEventListener(\"resize\", () => { clearTimeout(rz); rz = setTimeout(() => { renderKpis(); if (S.open) drawHist(); }, 200); });\r\n\r\n(async () => {\r\n  await refreshMe();\r\n  S.cats = await api(\"/v1/categories\");\r\n  renderCats();\r\n  S.feed = await api(\"/v1/activity?limit=20\");\r\n  await refreshMarkets();\r\n  await refreshMine();\r\n  connectStream();\r\n})().catch((e) => toast(\"No se pudo cargar: \" + e.message));\r\n<\/script>\r\n</body>\r\n</html>\r\n";
